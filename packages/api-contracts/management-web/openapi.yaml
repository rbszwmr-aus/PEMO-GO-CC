  /cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: Case queue across the scope (S4).
      description: |
        Cases are listed at estate level and reference units — mixed-level by default.

        **Boundary, stated by the export and kept:** enquiries and complaints raised by
        residents live in PEMO; **maintenance execution stays in the external CMMS.**
        `ADR-007` `A5` records CMMS as an outward write path PEMO has never had, needing
        its own decision before any contract admits it.

        **Deferred writes:** assign, reassign, re-categorise, close.
      parameters:
        - $ref: '#/components/parameters/ScopeParam'
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [open, assigned-to-me, overdue, all]
            default: open
      responses:
        '200':
          description: Case list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScopeNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /notices:
    get:
      tags: [Notices]
      operationId: listNotices
      summary: Notices whose targeting INTERSECTS the caller scope.
      description: |
        **RESHAPED AT `GEN-043` TO THE `ADR-019` MODEL. This is the breaking change
        that took management-web to `2.0.0`.** The previous shape was an S5 read
        placeholder that no route ever served: a single `title` rather than two
        languages, a `type` enum of `building-services | planned-interruption |
        community | emergency-follow-up`, a `state` enum of `awaiting-approval |
        published`, and `audience` / `channels` / `approval` objects. `ADR-019`
        replaced that model, and `channels` belongs to Notification, not here.

        **READ IS INCLUSIVE; WRITE IS CONJUNCTIVE.** A staff caller SEES a notice
        when its targeting rule touches ANY node in their scope, but may only
        ADDRESS one when their scope covers EVERY node it names. Requiring cover to
        read would hide an estate-wide notice from the building manager it affects,
        who then cannot answer residents about it.

        All lifecycle states appear, drafts included: this is the staff view of what
        management is saying and considering saying.

        **`UI-045` G4 — the filters are now CONTRACTED.** At `2.0.0` the operation
        declared no parameters, so `UI-045`'s screens narrowed what the server had
        already returned and said so on screen. These narrow the RESULT SET; they
        decide nothing about access, which stays the intersection above. Omitting
        them returns everything in scope, exactly as before.
      parameters:
        - name: lifecycleState
          in: query
          required: false
          description: Return only notices in these states. Omitted means all.
          schema:
            type: array
            items:
              type: string
              enum: [draft, pending_approval, approved, scheduled, live, expired, withdrawn]
        - name: noticeType
          in: query
          required: false
          description: Return only notices of these types. Omitted means all.
          schema:
            type: array
            items:
              type: string
              enum: [general, planned_interruption, emergency, event_community]
      responses:
        '200':
          description: The notices this caller may see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffNoticeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Notices]
      operationId: composeNotice
      summary: Compose a notice as a draft (ADR-019 D3).
      description: |
        **THE AUTHOR FLOOR IS A COVERING CONJUNCTION** (`ADR-017` `D1`, lifted to
        `estate_staff` by `GEN-040`): the caller must hold a live grant at EVERY node
        the targeting rule addresses. Covering some of them is not partial authority
        to address some, because there is no partial notice -- you cannot address a
        notice to a building you do not administer. A Location target contributes
        every node in its serving scope, so a lift notice requires authority at the
        floors it serves, not merely somewhere in the building.

        **Idempotency stance: `client-key`** (`ADR-015` `D1`). The notice id is
        DERIVED from the operation and the key, so a retry on a dropped connection
        cannot leave two drafts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeNoticeRequest'
      responses:
        '201':
          description: The draft was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeActResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /notices/{noticeId}:
    get:
      tags: [Notices]
      operationId: getNotice
      summary: One notice, with its targeting rule and disposition history.
      description: |
        **RESHAPED AT `GEN-043`** — see `listNotices`. The current assertion plus the
        full chain of what was done to it and by whom. That chain IS the history:
        `ADR-019` `D4` makes state a computed function of the assertions rather than
        a stored column, so "what happened to this notice?" is answered by reading
        them.

        The **writes this operation once listed as deferred** — create draft, save
        draft, submit for approval, approve, schedule, publish, correct, withdraw —
        all landed at `GEN-040` and `GEN-042` and are contracted beside it.

        A caller who cannot see the notice receives **404**, never a distinct refusal
        that would confirm it exists.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: The notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffNoticeDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /notices/{noticeId}/acknowledgements:
    get:
      tags: [Notices]
      operationId: getNoticeOutstanding
      summary: Per-recipient acknowledgement status (COM-03).
      description: |
        Who was told, and who has responded. **Unacknowledged recipients come
        first**, because the list exists to be worked through. Scoped by the SAME
        predicate as the detail, not a second rule: a caller who cannot see the
        notice cannot see who received it.

        This surface RECORDS; it does not chase. Reminders belong to Notification.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: The recipients and their status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeOutstandingResponse'
        # UI-045 G6: this operation declared only 200 and 404, unlike every
        # sibling, so three of its four required screen states had no contracted
        # response behind them.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /notices/{noticeId}/delivery:
    get:
      tags: [Notices]
      operationId: getNoticeEmailDelivery
      summary: Email-channel delivery ledger for one notice.
      description: |
        Staff delivery read for the email channel only. `schedule` is always `null`
        in this freeze (ADR-019 leaves schedule out of notices). An empty `sends`
        array on 200 means no email has been recorded. Out-of-scope and missing
        share one 404 (`notice-not-found`).
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: Notice email delivery ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEmailDeliveryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/CommunicationsUnavailable' }

  /notices/{noticeId}/email:
    post:
      tags: [Notices]
      operationId: sendNoticeEmail
      summary: Email a notice to current residential occupants with contact email.
      description: |
        No body. Recipients are current residential occupancies of the notice's
        existing targets whose household has `contact_email`. One outbox row per
        distinct address (`kind=notice`). `404` when the notice is missing or out
        of scope. `422` `notice-email-no-recipient` when the audience has no
        contact email.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: Notice email send recorded (one result per recipient).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeEmailSendResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/CommunicationsUnavailable' }

  /notices/{noticeId}/revise:
    post:
      tags: [Notices]
      operationId: reviseNotice
      summary: Revise a draft.
      description: |
        Content, schedule AND targeting may all change while a notice is a draft. The floor is
        checked against the NEW targeting, because revising a draft to address a building you
        do not administer is the escalation the conjunction exists to stop.

        **Idempotency stance: `derived-key`** on `(noticeId, fromVersion)`
        (`ADR-015` `D1`). A repeat naming the version that is still current is a
        retry and replays; one naming a superseded version is a caller acting on a
        notice that moved under them, and it is refused as **409** rather than
        applied to the new state -- which would be them approving text they never
        read.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTransitionRequest'
      responses:
        '200':
          description: The transition was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeActResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notices/{noticeId}/submit:
    post:
      tags: [Notices]
      operationId: submitNotice
      summary: Send a gated notice for approval.
      description: |
        Only meaningful for a type the organization has gated. Submitting an ungated type is
        refused rather than stranding the notice in a state no approver is expected to look at.

        **Idempotency stance: `derived-key`** on `(noticeId, fromVersion)`
        (`ADR-015` `D1`). A repeat naming the version that is still current is a
        retry and replays; one naming a superseded version is a caller acting on a
        notice that moved under them, and it is refused as **409** rather than
        applied to the new state -- which would be them approving text they never
        read.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTransitionRequest'
      responses:
        '200':
          description: The transition was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeActResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notices/{noticeId}/approve:
    post:
      tags: [Notices]
      operationId: approveNotice
      summary: Approve a notice for publication.
      description: |
        THE APPROVER HAS THEIR OWN FLOOR, and it is a different TYPE from the author one:
        `RoleScope<approver>` rather than `RoleScope<estate_staff>`, so a staff scope cannot
        reach this act at all (`ADR-018`, generalised at `GEN-040`). A reason code is
        optional -- an approval with nothing to add is the normal outcome.

        **Idempotency stance: `derived-key`** on `(noticeId, fromVersion)`
        (`ADR-015` `D1`). A repeat naming the version that is still current is a
        retry and replays; one naming a superseded version is a caller acting on a
        notice that moved under them, and it is refused as **409** rather than
        applied to the new state -- which would be them approving text they never
        read.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTransitionRequest'
      responses:
        '200':
          description: The transition was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeActResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notices/{noticeId}/decline:
    post:
      tags: [Notices]
      operationId: declineNotice
      summary: Send a notice back to its author.
      description: |
        Returns the notice to `draft`, not to a dead end: the point of declining is that the
        author revises and resubmits. **A reason code is REQUIRED** -- somebody has had their
        work sent back and they are owed the reason.

        **Idempotency stance: `derived-key`** on `(noticeId, fromVersion)`
        (`ADR-015` `D1`). A repeat naming the version that is still current is a
        retry and replays; one naming a superseded version is a caller acting on a
        notice that moved under them, and it is refused as **409** rather than
        applied to the new state -- which would be them approving text they never
        read.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTransitionRequest'
      responses:
        '200':
          description: The transition was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeActResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notices/{noticeId}/publish:
    post:
      tags: [Notices]
      operationId: publishNotice
      summary: Publish, snapshotting the audience.
      description: |
        Resolves the targeting rule AS AT THIS INSTANT and writes the audience snapshot in the
        SAME TRANSACTION as the assertion and the event. Refused if either language is empty,
        if the schedule is inverted, if a gated type is unapproved, or **if the rule resolves
        to nobody** -- far likelier a mistargeting than a deliberate broadcast to an empty
        building.

        **Idempotency stance: `derived-key`** on `(noticeId, fromVersion)`
        (`ADR-015` `D1`). A repeat naming the version that is still current is a
        retry and replays; one naming a superseded version is a caller acting on a
        notice that moved under them, and it is refused as **409** rather than
        applied to the new state -- which would be them approving text they never
        read.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTransitionRequest'
      responses:
        '200':
          description: The transition was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeActResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notices/{noticeId}/correct:
    post:
      tags: [Notices]
      operationId: correctNotice
      summary: Correct a published notice.
      description: |
        Content and schedule ONLY: **the targeting rule may not change.** The snapshot records
        who WAS addressed, and a correction that retargeted would leave it describing an
        audience the notice no longer has. Retarget by withdrawing and issuing a new notice.
        A reason code is REQUIRED.

        **Idempotency stance: `derived-key`** on `(noticeId, fromVersion)`
        (`ADR-015` `D1`). A repeat naming the version that is still current is a
        retry and replays; one naming a superseded version is a caller acting on a
        notice that moved under them, and it is refused as **409** rather than
        applied to the new state -- which would be them approving text they never
        read.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTransitionRequest'
      responses:
        '200':
          description: The transition was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeActResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /notices/{noticeId}/withdraw:
    post:
      tags: [Notices]
      operationId: withdrawNotice
      summary: Withdraw a published notice.
      description: |
        The audience snapshot is RETAINED. Withdrawing un-tells people going forward; it does
        not make it untrue that they were told, and deleting the snapshot would erase the only
        record of who received it. A reason code is REQUIRED.

        **Idempotency stance: `derived-key`** on `(noticeId, fromVersion)`
        (`ADR-015` `D1`). A repeat naming the version that is still current is a
        retry and replays; one naming a superseded version is a caller acting on a
        notice that moved under them, and it is refused as **409** rather than
        applied to the new state -- which would be them approving text they never
        read.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeTransitionRequest'
      responses:
        '200':
          description: The transition was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeActResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:

  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Staff session credential. The identity provider is Unresolved and is not selected here.

        **Authorization is structural, and there is no role vocabulary in this contract.**
        `ADR-007` `A4`: the export shows exactly one role and no screen renders differently
        for another, so there is no design evidence for what any role may do. A contract
        that named roles would have decided that question by omission.

        What the contract does encode:

        - **Scope filtering.** A principal holds one or more scope grants. Every read is
          filtered to the union of their subtrees. See `ScopeRef`.
        - **Tier.** `ADR-007` `D3`. The `source` projection carries provenance for estate
          staff; raw payloads and correlation traces are a different tier and are not in
          this contract at all — not gated, absent.
        - **Organization isolation.** Rooted at the `ADR-002` tenancy root. A principal in
          one Organization can reach no data in another under any path.

  parameters:
    NoticeId:
      name: noticeId
      in: path
      required: true
      description: The notice instance identifier. Stable across every revision.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        `ADR-015` `D1`, stance `client-key`. A client-chosen key that makes a retry
        safe. The act's own id is DERIVED from the operation and this key, so a
        retry cannot present a different act and be refused as a conflict; the same
        key offered for a DIFFERENT request is refused (`D5`) on the request
        fingerprint, never silently answered with the earlier act's result.
      schema: { type: string, minLength: 8, maxLength: 200 }
    EventId:
      name: eventId
      in: path
      required: true
      description: Opaque PEMO safety-event identifier. Not a source-system identifier.
      schema: { type: string }

    ScopeParam:
      name: scope
      in: query
      required: false
      description: |
        Restrict the response to this scope node's subtree. Omitted means the union of the
        principal's grants.

        **Filtering happens in the query, never in the client.** `ADR-007` `D5`/`A1`: nine
        of eleven surfaces span levels, so mixed-level rows are the default response shape.
        A response that carried out-of-scope rows for a client to hide would already have
        leaked them.
      schema: { $ref: '#/components/schemas/ScopeRef' }
    PageLimit:
      name: limit
      in: query
      required: false
      description: |
        Maximum rows in this page. Defaults to 2000 and is capped at 2000.
        A value that is not a positive integer is 400 `invalid-request`.
      schema: { type: integer, minimum: 1 }
    PageAfter:
      name: after
      in: query
      required: false
      description: |
        Stable key of the last row on the previous page. The next page starts
        after it. A key that is not in this result set (stale, deleted, or
        unknown) is 410 `cursor-expired`; the client must restart the walk.
        Never answered as a silent empty last page.
      schema: { type: string }

  responses:
    Conflict:
      description: |
        A DOMAIN REFUSAL, never a fault (`ADR-013` `C4`). The caller asked for
        something reasonable about a notice that has moved on, or whose type requires
        approval. Retrying the identical request will not help; the caller re-reads
        and decides again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: |
        The request is well formed and the act refuses it on its own terms -- a
        publication missing one of its two languages, an inverted schedule, or a
        targeting rule that reaches nobody.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid staff session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The target lies outside every scope grant this principal holds.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or its existence must not be disclosed to this principal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ScopeNotFound:
      description: No such scope node or Location, deliberately indistinguishable from another tenant's.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RestrictedProjection:
      description: |
        Integration-support material. `ADR-007` `D3`: raw payloads and correlation traces
        are a different tier. The export draws a `Request access` path; that is a write and
        is deferred.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: |
        The request could not be read. The detail names the FIELD and the problem and
        never echoes the value — a rejected value repeated back is a reflected input.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CursorExpired:
      description: |
        The `after` cursor is no longer in the result set (deleted, stale, or
        unknown). The client must restart the walk from the first page. Never
        a 200 with an empty last page.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: |
        Unexpected server-side failure. A client renders an explicit error state and never
        a normal one — the same never-render-as-normal rule the resident surface carries.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    CommunicationsUnavailable:
      description: |
        The communications port is unconfigured. This is not a successful send and not a
        silent no-op. A client renders an explicit unavailable state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    NoticeRow:
      type: object
      description: |
        The S2 overview's compact notice summary. RETAINED UNCHANGED through the
        GEN-043 MAJOR: `recentNotices` on the overview is a DIFFERENT operation, and
        a major bump is not a licence to reshape everything that touches the word
        "notice". Only `listNotices` and `getNotice` moved to the ADR-019 model.
      required: [noticeId, type, title, state]
      additionalProperties: false
      properties:
        noticeId:
          type: string
        type:
          type: string
          enum: [building-services, planned-interruption, community, emergency-follow-up]
        title:
          $ref: '#/components/schemas/LocalizedText'
        state:
          type: string
          enum: [draft, awaiting-approval, scheduled, published, withdrawn]
        publishedAt:
          type: string
          format: date-time
          nullable: true
    NoticeTarget:
      type: object
      description: |
        One row of the targeting rule. Names a hierarchy node, or an `ADR-003`
        Location, or both -- never neither. A Location target addresses whoever the
        Location SERVES, which for a partial-floor lift is its floors and not its
        block.
      properties:
        nodeKind:
          type: string
          nullable: true
          enum: [organization, estate, building, floor, unit]
        nodeId:
          type: string
          nullable: true
          maxLength: 120
        locationId:
          type: string
          nullable: true
          maxLength: 120
      additionalProperties: false
    ComposeNoticeRequest:
      type: object
      required: [noticeType, titleEn, titleZhHant, bodyEn, bodyZhHant, targets]
      description: |
        BOTH LANGUAGES ARE PRESENT IN THE SHAPE even though a draft may leave them
        empty: publication refuses a half-translated notice, and a schema that made
        one optional would push that decision to the moment of publishing.
      properties:
        noticeType:
          type: string
          enum: [general, planned_interruption, emergency, event_community]
        titleEn:
          type: string
          maxLength: 200
        titleZhHant:
          type: string
          maxLength: 200
        bodyEn:
          type: string
          maxLength: 20000
        bodyZhHant:
          type: string
          maxLength: 20000
        publishAt:
          type: string
          format: date-time
          nullable: true
        expireAt:
          type: string
          format: date-time
          nullable: true
        mandatoryAck:
          type: boolean
          default: false
        incidentRef:
          type: string
          nullable: true
          description: A home_safety event this notice accompanies, by stable id. No foreign key.
        responseOptions:
          type: array
          nullable: true
          description: |
            A small declared list of option keys this notice accepts, or null for a
            notice that asks nothing. Free text is deferred behind `ADR-019` `OQ4`
            (retention), because prose is what a retention rule is about.
          items:
            type: string
            maxLength: 60
        targets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoticeTarget'
      additionalProperties: false
    NoticeTransitionRequest:
      type: object
      required: [fromVersion]
      # ─── GEN-047: the contract forbade exactly what the server accepts ──────
      # At 2.0.0 this schema declared `fromVersion` and `reasonCode` under
      # `additionalProperties: false`, while `reviseNotice` and `correctNotice`
      # read `titleEn`, `titleZhHant`, `bodyEn`, `bodyZhHant`, `publishAt`,
      # `expireAt`, `mandatoryAck`, `responseOptions` and `targets` from the same
      # body and applied them. A client conforming to the contract LITERALLY could
      # never change a notice's content — the only two operations for changing
      # content took a body that permitted none of it.
      #
      # Found by the D3 fixtures: recording a real revise produced a request the
      # contract rejected. Eleven operations had no fixture, so nothing had ever
      # compared this schema against a real call. Adding OPTIONAL properties
      # widens what a server must accept, which ADR-008's table puts at minor.
      #
      # The fields are optional and shared across all seven transitions because
      # the ACT decides which are meaningful: `submit` ignores content, and
      # `correct` REFUSES a changed `targets` rather than ignoring it, so the
      # refusal comes from the act that owns the rule instead of from a shape.
      description: |
        `fromVersion` is what makes a retry distinguishable from a late duplicate. A
        repeat naming the current version replays; one naming a superseded version is
        refused, because applying it to the new state would be the caller acting on
        text they never read.
      properties:
        fromVersion:
          type: integer
          minimum: 1
        titleEn:
          type: string
        titleZhHant:
          type: string
        bodyEn:
          type: string
        bodyZhHant:
          type: string
        publishAt:
          type: string
          format: date-time
          nullable: true
        expireAt:
          type: string
          format: date-time
          nullable: true
        mandatoryAck:
          type: boolean
        responseOptions:
          type: array
          items:
            type: string
        targets:
          type: array
          description: |
            Accepted on every transition and JUDGED BY THE ACT: `revise` may change
            the targeting of a draft, and `correct` REFUSES a change with
            `retargeting-forbidden` because the snapshot records who WAS addressed.
            Passing it through rather than dropping it is what lets that refusal
            come from the act instead of being silently swallowed by the shape.
          items:
            $ref: '#/components/schemas/NoticeTarget'
        reasonCode:
          type: string
          nullable: true
          # THE VOCABULARY IS GENERATED (GEN-052 D3): the union of the four acts'
          # codes in packages/api-contracts/notice-reasons.json, verified by
          # generate-notice-reasons.mjs. Which codes each act accepts, and whether
          # one is required, is the act's rule; the enum is what a client may offer.
          enum: [approved_as_submitted, clarification, factual_error, inaccurate, issued_in_error, needs_translation, no_longer_applicable, not_required, poor_timing, superseded, translation_error, with_amendments, wrong_audience, wrong_schedule]
          description: |
            Required for decline, correct and withdraw; optional for approve. The
            per-act subsets: approve `approved_as_submitted | with_amendments`;
            decline `inaccurate | wrong_audience | poor_timing | needs_translation |
            not_required`; correct `factual_error | wrong_schedule | translation_error |
            clarification`; withdraw `issued_in_error | no_longer_applicable |
            superseded | wrong_audience`. A code outside the act's subset is refused
            by the act with a `bad-request` Problem naming the permitted set.
      additionalProperties: false
    NoticeActResponse:
      type: object
      description: |
        **`GEN-047`: `meta` was missing from all eleven write responses.** This
        contract says of `meta` that it "echoes the correlation identifier, which
        the parity harness requires of every fixture — a response that cannot be
        correlated cannot be traced", and every READ response carries it. The
        write surface `GEN-042` added carried none, so an act could not be
        correlated with the request that performed it — the one place a
        correlation identifier is most worth having, because it is where something
        changed.

        Nothing caught it because those eleven operations had no fixtures; the
        rule is enforced by the parity harness, and the harness only sees
        operations a fixture reaches.
      required:
        - meta
        - noticeId
        - version
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        noticeId:
          type: string
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    StaffNoticeListItem:
      type: object
      # REQUIRED (GEN-047 step ruling (b)): an always-emitted field declared optional
      # is a false contract — every client codes an absence that never occurs.
      # ADR-008 permits required additions as MINOR.
      required: [noticeId, noticeType, titleEn, titleZhHant, lifecycleState,
                 stateEnteredAt, permittedActions, mandatoryAck, version]
      properties:
        noticeId:
          type: string
        noticeType:
          type: string
        titleEn:
          type: string
        titleZhHant:
          type: string
          description: |
            `UI-045` G2: at `2.0.0` the list carried `titleEn` only while the detail
            carried both, so "the title in the current locale" was not satisfiable
            on the list at all.
        lifecycleState:
          type: string
          enum: [draft, pending_approval, approved, scheduled, live, expired, withdrawn]
          description: |
            COMPUTED from the assertion chain (`ADR-019` `D4`), never stored. The
            vocabulary is DISJOINT from the disposition vocabulary, so a comparison
            against the wrong one is a type error rather than a silent false.
        publishAt:
          type: string
          format: date-time
          nullable: true
        expireAt:
          type: string
          format: date-time
          nullable: true
        mandatoryAck:
          type: boolean
        version:
          type: integer
        permittedActions:
          type: array
          description: |
            THE ACTS THIS CALLER MAY PERFORM ON THIS NOTICE NOW, decided by the
            server (`GEN-047` D1). The client renders a control if and only if its
            act is listed here, and reasons about no role of its own — a client
            that decides for itself is a second copy of the authorization rules,
            free to drift from the acts that enforce them.

            It is a DRY RUN of the acts, not a description of them: the same state
            precondition function the acts call, and the same covering floor
            (`ADR-017`) at the addressed nodes for the role the act demands
            (`ADR-018`).

            CONTENT refusals are NOT predicted. `publish` also refuses a
            half-translated notice or one addressed to nobody, but those are facts
            about what the author has typed rather than about their authority, and
            a control hidden because a body is empty teaches the author that
            publishing is forbidden rather than that a translation is missing.
            Those are shown by attempting the act.
          items:
            type: string
            # THE ACT VOCABULARY: the contract's own operationIds (Amendment 1, A1),
            # verified against the POST operations by generate-act-operations.mjs.
            enum: [addEstateContact, addMembership, approveNotice, composeNotice, conferGrant, correctNotice, declineNotice, endOccupancy, provisionOrganization, publishManagementUpdate, publishNotice, recordOccupancy, registerPrincipal, removeMembership, reviseNotice, revokeGrant, submitNotice, withdrawNotice]
        stateEnteredAt:
          type: string
          format: date-time
          description: |
            When the notice entered `lifecycleState` — the `recordedAt` of the
            assertion whose disposition the view translates into that state
            (`GEN-047` D2, closing `UI-045` G5).

            A-05's oldest-first approval queue needs a clock and the list had none:
            `publishAt`/`expireAt` are null for every `pending_approval` row and
            `version` is a counter. It is the LATEST assertion's timestamp, never
            the instance's first. For the clock-decided states this is the
            publication assertion; `expired` in particular is entered at `expireAt`,
            which the caller already has.
      additionalProperties: false
    StaffNoticeListResponse:
      type: object
      required: [meta, notices]
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/StaffNoticeListItem'
      additionalProperties: false
    NoticeHistoryEntry:
      type: object
      required: [version, disposition, recordedAt, recordedBy]
      properties:
        version:
          type: integer
        disposition:
          type: string
          enum: [draft_saved, approval_requested, approval_granted, publication_released, withdrawal_recorded]
          description: WHAT AN ACTOR DID. Disjoint from the lifecycle vocabulary by construction.
        recordedAt:
          type: string
          format: date-time
        recordedBy:
          type: string
      additionalProperties: false
    StaffNoticeDetailResponse:
      type: object
      description: |
        The envelope every management response on this surface carries. `meta`
        echoes the correlation identifier, which the parity harness requires of
        every fixture -- a response that cannot be correlated cannot be traced.
      required: [meta, notice]
      additionalProperties: false
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        notice:
          $ref: '#/components/schemas/StaffNoticeDetail'
    StaffNoticeDetail:
      type: object
      description: |
        FLAT, NOT `allOf`. Composing this from `StaffNoticeListItem` plus an
        extension read better and did not work: under JSON Schema each `allOf`
        branch is evaluated independently, so two branches that each say
        `additionalProperties: false` reject each other's properties and NOTHING
        validates. Repetition here is the price of a strict contract, and the
        fixture is what keeps the two in step.
      required:
        - noticeId
        - noticeType
        - titleEn
        - titleZhHant
        - bodyEn
        - bodyZhHant
        - lifecycleState
        - stateEnteredAt
        - permittedActions
        - mandatoryAck
        - version
        - targets
        - history
      additionalProperties: false
      properties:
        noticeId:
          type: string
        noticeType:
          type: string
          enum: [general, planned_interruption, emergency, event_community]
        titleEn:
          type: string
        titleZhHant:
          type: string
        bodyEn:
          type: string
        bodyZhHant:
          type: string
        lifecycleState:
          type: string
          enum: [draft, pending_approval, approved, scheduled, live, expired, withdrawn]
        stateEnteredAt:
          type: string
          format: date-time
          description: |
            As `StaffNoticeListItem.stateEnteredAt` (`GEN-047` D2). Repeated because
            this schema is FLAT rather than `allOf` — see the note above.
        permittedActions:
          type: array
          description: |
            As `StaffNoticeListItem.permittedActions` (`GEN-047` D1). Repeated for
            the same reason. Content refusals are shown, never predicted.
          items:
            type: string
            # THE ACT VOCABULARY: the contract's own operationIds (Amendment 1, A1),
            # verified against the POST operations by generate-act-operations.mjs.
            enum: [addEstateContact, addMembership, approveNotice, composeNotice, conferGrant, correctNotice, declineNotice, endOccupancy, provisionOrganization, publishManagementUpdate, publishNotice, recordOccupancy, registerPrincipal, removeMembership, reviseNotice, revokeGrant, submitNotice, withdrawNotice]
        publishAt:
          type: string
          format: date-time
          nullable: true
        expireAt:
          type: string
          format: date-time
          nullable: true
        mandatoryAck:
          type: boolean
        version:
          type: integer
        responseOptions:
          type: array
          nullable: true
          items:
            type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/NoticeTarget'
        history:
          type: array
          description: The disposition chain. STAFF ONLY -- residents never receive it.
          items:
            $ref: '#/components/schemas/NoticeHistoryEntry'

    NoticeRecipientStatus:
      type: object
      required: [residentId, unitId]
      properties:
        residentId:
          type: string
        unitId:
          type: string
        read:
          type: string
          format: date-time
          nullable: true
        acknowledged:
          type: string
          format: date-time
          nullable: true
        response:
          type: string
          nullable: true
      additionalProperties: false
    NoticeOutstandingResponse:
      type: object
      # GEN-047: this response carried no `meta` either — same omission as the
      # write surface, and invisible for the same reason (no fixture reached it).
      required: [meta, noticeId, mandatoryAck, recipients]
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        noticeId:
          type: string
        mandatoryAck:
          type: boolean
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/NoticeRecipientStatus'
      additionalProperties: false

    # ------------------------------------------------------- grant administration
    ConferGrantRequest:
      type: object
      additionalProperties: false
      required: [groupId, role, nodeKind, nodeId, reasonCode]
      properties:
        groupId:
          type: string
          description: The GROUP that will hold the grant. `ADR-012` `D2` -- there are no direct grants to a principal.
        role:
          type: string
          enum: [estate_staff, approver, integration_support, grant_administrator, resident]
          description: |
            `ADR-010` `D2`'s four management roles plus `resident`. Roles are
            orthogonal to `ADR-007` `D3`'s tiers (`ADR-010` `D5`): tiers decide what a
            surface may show, roles and scope decide what a principal may do, and
            neither mechanism reads the other.
        nodeKind:
          type: string
          enum: [organization, portfolio, estate, phase, building, floor, unit, location]
          description: The kind half of a `ScopeRef`. A hierarchy node or an `ADR-003` Location.
        nodeId:
          type: string
          description: The node the grant covers. The caller must already hold `grant_administrator` over it.
        effectiveFrom:
          type: string
          format: date-time
          description: When the grant takes effect. Defaults to the request instant.
        reasonCode:
          type: string
          enum: [new_appointment, role_change, cover_absence, contractor_engagement]
          description: |
            `ADR-014`. REQUIRED: conferring authority without a recorded why is the
            audit gap `ADR-014` exists to close. The vocabulary is small and carries
            no `other` -- a forced catch-all is the noise `D4` warns about. `role_change`
            is shared with `revokeGrant` because it means the same thing on both,
            which is the registry rule (`D3`): shared if and only if the semantics
            are identical.

    RevokeGrantRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        effectiveTo:
          type: string
          format: date-time
          description: When the grant ends. Defaults to the request instant.
        reasonCode:
          type: string
          enum: [staff_departed, role_change, cover_ended, granted_in_error]
          description: |
            `ADR-014`, REQUIRED. `granted_in_error` earns its place: revoking a
            mistake is not the same act as revoking a departure, and an audit that
            cannot tell them apart cannot answer why.

    ProvisionRequest:
      type: object
      additionalProperties: false
      required: [externalId, displayName, groupName, reasonCode]
      description: |
        **BREAKING at `1.0.0`.** `groupId` was REMOVED: the act no longer takes an
        existing group, it CREATES one. Removing a field is breaking under the
        `ADR-008` amendment *field-removal-is-breaking* (2026-09-01) — a consumer
        that read the field cannot be satisfied once it is gone, and the direction
        of the change does not determine breakage. The amendment also fixes the
        general rule: **not listed in the version table is never a licence.**
      properties:
        externalId:
          type: string
          description: |
            The first administrator's stable identifier in the EXTERNAL
            authenticator (`ADR-016` `D3`). Never a credential — PEMO authorizes,
            it does not authenticate, and nothing secret is stored.
        displayName:
          type: string
          description: The person's name, for humans reading an audit or a member list.
        groupName:
          type: string
          description: The display name of the group this act creates to hold the first grant.
        reasonCode:
          type: string
          enum: [organization_provisioned]
          description: One fixed code. The act's `source` already says it is provisioning.

    GrantResponse:
      type: object
      additionalProperties: false
      required: [meta, grant]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        replayed:
          type: boolean
          description: |
            True when this response was RE-DERIVED from an act an earlier identical
            request performed (`ADR-015` `D4`). Accompanied by `200` rather than
            `201`: a replay is not a creation.
        grant:
          type: object
          additionalProperties: false
          required: [grantId, groupId, role, node, version]
          properties:
            grantId:
              type: string
              description: The grant INSTANCE. Derived from the operation and the idempotency key.
            groupId: { type: string }
            role:
              type: string
              enum: [estate_staff, approver, integration_support, grant_administrator, resident]
              description: |
                `ADR-010` `D2`'s four management roles plus `resident`. Roles are
                orthogonal to `ADR-007` `D3`'s tiers (`ADR-010` `D5`): tiers decide what a
                surface may show, roles and scope decide what a principal may do, and
                neither mechanism reads the other.
            node: { $ref: '#/components/schemas/ScopeRef' }
            version:
              type: integer
              description: The assertion version. 1 for a conferral; `n + 1` for a revocation.
            effectiveFrom: { type: string }
            effectiveTo: { type: string, nullable: true }

    # ---------------------------------------------------------------- scope model
    RegisterPrincipalRequest:
      type: object
      additionalProperties: false
      required: [organizationId, externalId, displayName]
      properties:
        organizationId: { type: string }
        externalId:
          type: string
          description: |
            The person's stable identifier in the EXTERNAL authenticator
            (`ADR-016` `D3`). **Never a credential** — nothing secret is accepted.
        displayName:
          type: string
          description: For humans reading an audit or a member list.

    PrincipalResponse:
      type: object
      additionalProperties: false
      required: [meta, principal]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        replayed: { type: boolean }
        principal:
          type: object
          additionalProperties: false
          required: [principalId, organizationId, displayName]
          properties:
            principalId: { type: string }
            organizationId: { type: string }
            displayName: { type: string }

    AddMembershipRequest:
      type: object
      additionalProperties: false
      required: [principalId, reasonCode]
      properties:
        principalId: { type: string }
        effectiveFrom: { type: string, format: date-time }
        reasonCode:
          type: string
          enum: [new_appointment, role_change, cover_absence, contractor_engagement]
          description: |
            `ADR-014`, REQUIRED. The same vocabulary as `conferGrant`, because
            seating someone in a group and granting that group a role are the same
            event seen from two sides — the registry rule is *shared if and only if
            the semantics are identical*.

    RemoveMembershipRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        effectiveTo: { type: string, format: date-time }
        reasonCode:
          type: string
          enum: [staff_departed, role_change, cover_ended, added_in_error]
          description: |
            `ADR-014`, REQUIRED. `added_in_error` mirrors `granted_in_error` for the
            same reason: undoing a mistake is not the same act as recording a
            departure, and an audit that cannot tell them apart cannot answer why.

    MembershipResponse:
      type: object
      additionalProperties: false
      required: [meta, membership]
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        replayed: { type: boolean }
        membership:
          type: object
          additionalProperties: false
          required: [membershipId, groupId, principalId, version]
          description: |
            `groupId` and `principalId` carry the pair the act touched. Before
            `1.2.0` they were returned EMPTY on `removeMembership`, which made the
            response unreadable back — additive here, so a MINOR bump.
          properties:
            membershipId: { type: string }
            groupId: { type: string }
            principalId: { type: string }
            version: { type: integer }
            effectiveTo: { type: string, nullable: true }

    ScopeRef:
      type: object
      description: |
        A scope node — **`ADR-007` `A2`: a node in the `ADR-002` hierarchy OR an
        `ADR-003` Location.**

        The hierarchy alone cannot express the surface. `Counter` on the visitor screen and
        the clubhouse facility locations (`Clubhouse 2/F`, `Podium`) are addressable places
        with no floor and no unit, and a staff member who works the counter is scoped to
        one. `ADR-003` already separates `physical_parent` from `serving_scope` for exactly
        this reason, so the machinery exists rather than being invented here.
      required: [kind, id]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: |
            `organization` and `portfolio` are present from this first version per
            `ADR-007` `D9`/`A3`, though the export contains neither and its scope selector
            names one estate. The design predates `ADR-002`'s Organization tier; on
            structure the ADR wins. A scope model is the single hardest thing to widen
            later, because every endpoint and every stored grant assumes its shape.
          enum:
            - organization
            - portfolio
            - estate
            - phase
            - building
            - floor
            - unit
            - location
        id:
          type: string
          description: Opaque stable identifier for the node or Location.
        label:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: Server-composed display label. Read-only; never a key.

    ScopePath:
      type: object
      description: |
        The resolved ancestry of a row, so a client can render a mixed-level list without
        inferring level from a formatted string. Present on every row of every list.
      required: [node, ancestry]
      additionalProperties: false
      properties:
        node: { $ref: '#/components/schemas/ScopeRef' }
        ancestry:
          type: array
          description: Root-first, ending at the parent of `node`. Empty for a root.
          items: { $ref: '#/components/schemas/ScopeRef' }
        unassigned:
          type: boolean
          default: false
          description: |
            True when the row belongs to **no hierarchy node at all** — the quarantined
            safety event, which the export states as *"Not assigned to any household."*

            That is `ADR-006` `C4` rendered — visible, unassigned, never defaulted, never
            dropped — **arriving independently in a design made before that ADR existed.**
            A row with `unassigned: true` has an empty `ancestry` and is never silently
            filtered out of a scoped list, because dropping it is the failure `C4` forbids.

    # ------------------------------------------------------- shared domain vocabulary
    LocalizedText:
      type: object
      description: |
        Staff-visible copy. `en` and `zh-Hant` are always present.

        Simplified Chinese is **deliberately absent**: the shell offers three languages and
        the notice composer requires two, and `ADR-007` `A6` records whether `zh-Hans` is a
        content language or an interface language as an open product question. The shape is
        additive, so adding it later is not a breaking change.
      required: [en, zh-Hant]
      additionalProperties: false
      properties:
        en: { type: string, minLength: 1 }
        zh-Hant: { type: string, minLength: 1 }

    Severity:
      type: string
      description: |
        **Seven levels, GENERATED from `resident-mobile/severity.json`**, which is normative
        for both surfaces.

        The export's `T` object defines six and has no `offline`. `ADR-007` `D7` gives
        structural authority to the ADRs, and `UI-010-ST` already settled seven against a
        ruling that could have reduced it. Not reopened.

        **Placement debt, recorded rather than worked around:** `severity.json` is shared
        vocabulary living inside the `resident-mobile` package, the same misplacement
        `ADR-009`'s registry had before `API-016-ST` moved it up. It cannot move here —
        moving it would change the resident package, which this PID may not do.
      enum: [normal, information, advisory, warning, critical, offline, unknown]

    ManagementUpdateRequest:
      type: object
      description: |
        Bilingual by requirement, not by convention: a management update reaches
        residents through the safety event projection, and a single-language safety
        message is a message some residents cannot read.
      required: [bodyEn, bodyZhHant]
      additionalProperties: false
      properties:
        bodyEn: { type: string, minLength: 1, maxLength: 4000 }
        bodyZhHant: { type: string, minLength: 1, maxLength: 4000 }
        isAllClear:
          type: boolean
          default: false
          description: Whether this update stands down the event. Never inferred from the text.

    ManagementUpdateResponse:
      type: object
      required: [meta, eventId, update]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        eventId: { type: string }
        update:
          type: object
          required: [updateId, publishedAt, isAllClear]
          additionalProperties: false
          properties:
            updateId: { type: string }
            publishedAt:
              type: string
              format: date-time
              description: |
                The act instant, which is also the instant the audit record is dated at
                and the instant its authorizing grant is answerable against.
            isAllClear: { type: boolean }

    RecordOccupancyRequest:
      type: object
      required: [residentId, role]
      additionalProperties: false
      properties:
        residentId: { type: string }
        role:
          type: string
          enum: [owner_occupier, tenant, household_member, caregiver]
        effectiveFrom:
          type: string
          format: date-time
          description: |
            Defaults to the request instant. `unitClass` is NOT accepted from the client:
            it is copied from Property Core's record of the unit, so the denormalised
            value cannot disagree with the unit it describes.

    RecordOccupancyResponse:
      type: object
      required: [meta, unitId, occupancy]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        unitId: { type: string }
        occupancy:
          type: object
          required: [occupancyId, residentId, role, effectiveFrom]
          additionalProperties: false
          properties:
            occupancyId: { type: string }
            residentId: { type: string }
            role:
              type: string
              enum: [owner_occupier, tenant, household_member, caregiver]
            effectiveFrom: { type: string, format: date-time }

    AddEstateContactRequest:
      type: object
      description: |
        Bilingual by requirement: an estate contact is rendered to residents through the
        help-desk card, and a single-language contact is one some residents cannot read.
      required: [contactKind, nameEn, nameZhHant]
      additionalProperties: false
      properties:
        contactKind:
          type: string
          enum: [management_office, emergency, approved_service]
        nameEn: { type: string, minLength: 1, maxLength: 200 }
        nameZhHant: { type: string, minLength: 1, maxLength: 200 }
        telephone: { type: [string, 'null'], maxLength: 40 }
        hoursEn: { type: [string, 'null'], maxLength: 200 }
        hoursZhHant: { type: [string, 'null'], maxLength: 200 }
        sortOrder: { type: integer, default: 0 }

    AddEstateContactResponse:
      type: object
      required: [meta, estateId, contact]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        estateId: { type: string }
        contact:
          type: object
          required: [contactId, contactKind, nameEn, nameZhHant]
          additionalProperties: false
          properties:
            contactId: { type: string }
            contactKind:
              type: string
              enum: [management_office, emergency, approved_service]
            nameEn: { type: string }
            nameZhHant: { type: string }

    EndOccupancyRequest:
      type: object
      additionalProperties: false
      properties:
        effectiveTo:
          type: string
          format: date-time
          description: |
            When the tenure ends. Defaults to the request instant. There is deliberately no
            `reason` field: `access.audit_event` carries a fixed record — principal,
            authorising grant, action, target, instants — and no free-form payload, so a
            reason has nowhere to live that is not a new column on either the audit table or
            the occupancy. Both were declined; see the GEN-016 report.

    EndOccupancyResponse:
      type: object
      required: [meta, occupancyId, occupancy]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        occupancyId: { type: string, description: The instance that was ended. }
        occupancy:
          type: object
          required: [version, effectiveTo]
          additionalProperties: false
          properties:
            version:
              type: integer
              description: The version of the appended END assertion. The prior assertion is retained.
            effectiveTo: { type: string, format: date-time }

    Meta:
      type: object
      description: |
        Response envelope. Same HTTP projection of the committed message-envelope rules
        that `resident-mobile` uses — a correlation identifier per response plus explicit
        generation time.
      required: [correlationId, contractVersion, generatedAt]
      additionalProperties: false
      properties:
        correlationId: { type: string, format: uuid }
        contractVersion: { type: string, const: '2.7.0' }
        generatedAt:
          type: string
          format: date-time
          description: Receipt-side time. Never substituted for an occurrence time.
        partial:
          type: boolean
          default: false
        degraded:
          type: array
          items:
            type: object
            required: [section, reason]
            additionalProperties: false
            properties:
              section: { type: string }
              reason: { $ref: '#/components/schemas/LocalizedText' }

    Problem:
      type: object
      description: |
        RFC 9457 problem detail. `type` is constrained to the management projection of
        `packages/api-contracts/problem-types.json`.
      required: [type, title, status, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            GENERATED from the shared registry, filtered to `surfaces: management`.
            Do not author a type URI here.
          enum:
            - https://pemo.local/problems/communications-unavailable
            - https://pemo.local/problems/cursor-expired
            - https://pemo.local/problems/estate-not-found
            - https://pemo.local/problems/grant-already-exists
            - https://pemo.local/problems/grant-not-live
            - https://pemo.local/problems/grant-target-not-found
            - https://pemo.local/problems/idempotency-key-conflict
            - https://pemo.local/problems/identity-already-recorded
            - https://pemo.local/problems/insufficient-administration-scope
            - https://pemo.local/problems/insufficient-scope
            - https://pemo.local/problems/internal-error
            - https://pemo.local/problems/invalid-credential
            - https://pemo.local/problems/invalid-request
            - https://pemo.local/problems/last-grant-administrator
            - https://pemo.local/problems/management-office-contact-exists
            - https://pemo.local/problems/membership-already-exists
            - https://pemo.local/problems/membership-not-live
            - https://pemo.local/problems/notice-approval-required
            - https://pemo.local/problems/notice-empty-audience
            - https://pemo.local/problems/notice-incomplete-translation
            - https://pemo.local/problems/notice-not-found
            - https://pemo.local/problems/notice-out-of-scope
            - https://pemo.local/problems/notice-retargeting-forbidden
            - https://pemo.local/problems/notice-schedule-inverted
            - https://pemo.local/problems/notice-stale-version
            - https://pemo.local/problems/notice-wrong-state
            - https://pemo.local/problems/occupancy-already-exists
            - https://pemo.local/problems/occupancy-not-live
            - https://pemo.local/problems/occupancy-target-not-found
            - https://pemo.local/problems/organization-already-provisioned
            - https://pemo.local/problems/principal-target-not-found
            - https://pemo.local/problems/record-not-found
            - https://pemo.local/problems/restricted-projection
            - https://pemo.local/problems/scope-not-found
            - https://pemo.local/problems/session-expired
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        correlationId: { type: string, format: uuid }
        staffMessage:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: Staff-readable explanation. Distinct from a resident message.
        retryable: { type: boolean }

    # ------------------------------------------------------- shared value shapes
    ServiceTarget:
      type: object
      description: |
        **Resolution of an inferred field, and the same shape is reused twice.** The export
        renders three different semantics in one column — on S2 `due` shows `Overdue 11m`,
        `6h held` and `Approve`; on S4 `TARGET` shows `Overdue 4h`, `Due in 2h`,
        `Due tomorrow` and `Met`. Elapsed-overdue, elapsed-held, a future due time and an
        outcome are four different facts wearing one string.

        **A display may collapse what a reader disambiguates from context. A contract must
        not: the reader here is code, and code has no context.** So the state is an enum and
        the time is a separate, nullable field.
      required: [state, label]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [met, due, overdue, held, action-required]
        dueAt:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
        elapsedMinutes:
          anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
          description: Time overdue when `overdue`, or time held when `held`. Null otherwise.
        label:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: Server-composed rendering. Present for display; never the thing a client branches on.

    CommunicationState:
      type: string
      description: |
        Resolution of an inferred field — the export shows six values in a `COMMUNICATION`
        column and does not say whether they are a closed set. **Closed enumeration**,
        because a client branches on it and an open string cannot be branched on safely.
      enum:
        - not-resident-visible
        - published
        - published-acknowledged
        - update-overdue
        - scheduled
        - all-clear-sent
        - quarantined

    DeliveryState:
      type: object
      description: |
        Resolution of an inferred field. The export renders `Read 09:43`, `Delivered`,
        `Blocked`, `Scheduled` — and `Read 09:43` is **two facts in one string**. Split.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [scheduled, delivered, read, blocked]
        at:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]

    SafetyPermission:
      type: object
      description: |
        Resolution of an inferred field. The household `safety` column mixes `Full access`,
        `Not permitted` and `Expires in 49 days` — a state and a countdown in one column.

        The export also states the rule this shape must not contradict: **the permission is
        granted by the resident in the app, not by management.** Staff see who holds it and
        when it expires; revocation is a write and is deferred.
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [granted, not-permitted, expiring, expired]
        expiresAt:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]

    IntegrationFeed:
      type: object
      description: |
        Resolution of two inferred fields — the `IoT2Hub` and `CMMS` header chips carry no
        state, tooltip or legend in the export. Modelled as the same feed-health row S2
        already renders.

        **The name is `2IoThub`.** The export uses the retired `IoT2Hub` spelling in at
        least six places; `ADR-007` `D7` gives structural authority to the ADRs and
        `AG-002-AG` rule 3 fixes the name.
      required: [key, name, state]
      additionalProperties: false
      properties:
        key:
          type: string
          enum: [twoiothub, cmms]
        name: { type: string }
        state:
          type: string
          enum: [healthy, degraded, unavailable, unknown]
        lastExchangeAt:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]

    # ---------------------------------------------------------------- S1
    SafetyEventRow:
      type: object
      required: [eventId, reference, severity, title, scope, source, occurredAt, communication, needsAction]
      additionalProperties: false
      properties:
        eventId: { type: string }
        reference:
          type: string
          description: PEMO safety-event reference, the format the design uses.
          examples: ['HS-2026-08-12-004417']
        severity: { $ref: '#/components/schemas/Severity' }
        title: { $ref: '#/components/schemas/LocalizedText' }
        scope:
          allOf: [{ $ref: '#/components/schemas/ScopePath' }]
          description: |
            Structured, not a formatted string. The export renders the quarantined event's
            scope as prose that **embeds a device reference** — *"Source reports site 8829 /
            node C-903 — no PEMO unit matches"* — and that prose reaches the Overview
            dashboard three screens away. A device reference is permitted to this tier, but
            a reference buried in prose is invisible to the boundary scan. Structured here
            so the scan can see it as a field.
        unmappedSourceRef:
          anyOf: [{ type: string }, { type: 'null' }]
          description: Device or zone reference for a quarantined event with no unit match.
        scopeSummary:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: Server-composed display line, e.g. audience size. Display only.
        source:
          type: string
          enum: [in-unit-sensor, fire-panel, management]
        occurredAt:
          type: string
          format: date-time
          description: Occurrence at source. Never substituted by receipt time.
        communication: { $ref: '#/components/schemas/CommunicationState' }
        needsAction:
          type: boolean
          description: |
            The flag is contract; **the rule that sets it is policy and is deliberately not
            specified here.** The export exposes the boolean through a filter and never says
            what raises it.

    SafetyEventListResponse:
      type: object
      required: [meta, events, window]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        events:
          type: array
          items: { $ref: '#/components/schemas/SafetyEventRow' }
        window:
          type: object
          description: |
            **Resolution of an inferred field that had been queued as a product decision.**
            The export renders `6 of 6 events · last 24 hours`, and whether 24 hours is
            fixed or configurable was unanswerable from the design. Carrying the window
            explicitly removes the ambiguity from the contract without deciding the policy:
            whatever window the server applied, it says so. The default value remains a
            configuration question rather than a contract gap.
          required: [hours, returned, total, retentionMonths]
          additionalProperties: false
          properties:
            hours: { type: integer, minimum: 1 }
            returned: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
            retentionMonths:
              type: integer
              minimum: 1
              description: |
                **P1 closed as a contract gap by the same technique as the window.** The
                export renders the literal word `ASSUMED` beside `24 months`, so the value
                was unanswerable from the design — but the *contract* ambiguity was that
                24 would have been baked in. Carried as data, the response states whatever
                retention the server applies and the contract decides nothing.

                **The product decision is not closed:** what the retention period should be
                remains open, now as configuration rather than as a hole in the contract.

    SafetyEventDetailResponse:
      type: object
      required: [meta, event, residentProjection]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        event: { $ref: '#/components/schemas/SafetyEventRow' }
        residentProjection:
          type: object
          description: What the resident sees, shown to staff for review before publishing.
          required: [title, instruction, disclaimer]
          additionalProperties: false
          properties:
            title: { $ref: '#/components/schemas/LocalizedText' }
            instruction: { $ref: '#/components/schemas/LocalizedText' }
            disclaimer: { $ref: '#/components/schemas/LocalizedText' }

    SafetyEventDeliveryResponse:
      type: object
      required: [meta, recipients, timeline]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        recipients:
          type: array
          items:
            type: object
            required: [recipientId, name, role, state]
            additionalProperties: false
            properties:
              recipientId: { type: string }
              name: { type: string }
              role: { $ref: '#/components/schemas/LocalizedText' }
              state: { $ref: '#/components/schemas/DeliveryState' }
        timeline:
          type: array
          items:
            type: object
            required: [at, what]
            additionalProperties: false
            properties:
              at: { type: string, format: date-time }
              what: { $ref: '#/components/schemas/LocalizedText' }
              by:
                type: string
                description: |
                  Actor — a staff name or `PEMO`. **A name, not translatable copy**, so it is
                  a plain string. Found by the bilingual assertion, which flagged a
                  `zh-Hant` of `PEMO` as an untranslated placeholder: it was right that the
                  value was not Chinese and right that the field was modelled wrongly.
              tone:
                type: string
                enum: [neutral, positive, attention, critical]

    SafetyEventSourceResponse:
      type: object
      description: |
        Provenance for the estate-staff tier. **Both attributions are explicit** — `ADR-006`
        `C5` rendered, and the resolution of the sharpest disagreement the analysis found.

        The export's wording attributes classification to the source: *"classified by
        IoT2Hub"*, *"Classified CRITICAL by source"*. `ADR-006` `D1` says **PEMO
        classifies**, mapping the source's own event type to the seven-level vocabulary.
        The structure the export draws is compatible — it already shows the source
        classification as a distinct row beside the PEMO severity chip — so what changes is
        that the contract states both, and which is which.
      required: [meta, sourceSystem, sourceEventId, classification, occurredAt, mapping]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        sourceSystem:
          type: string
          enum: [twoiothub]
        sourceEventId:
          type: string
          description: |
            The upstream record's identifier. **Provenance, and visible to this tier** —
            `ADR-006` `C5` as amended: *"at minimum"* is a floor, not an enumeration. It
            answers *which record in the source system is this*, which is the reconciliation
            question of an incident investigation, and this tier already sees device and node
            references, so it is not what the boundary protects.
        classification:
          type: object
          required: [source, pemo]
          additionalProperties: false
          properties:
            source:
              type: object
              description: What the source system asserted, retained as a required input.
              required: [code, level]
              additionalProperties: false
              properties:
                code: { type: string, examples: ['FIRE_SMOKE'] }
                level: { type: string, examples: ['CRITICAL'] }
            pemo:
              type: object
              description: What PEMO shows, and under which approved policy version.
              required: [severity, policyVersion, classifiedAt]
              additionalProperties: false
              properties:
                severity: { $ref: '#/components/schemas/Severity' }
                policyVersion: { type: string }
                classifiedAt: { type: string, format: date-time }
        occurredAt:
          type: string
          format: date-time
          description: |
            Occurrence at source. The **receipt time is deliberately absent**: the export
            renders both and the two-second gap between them is transport latency, which is
            correlation-trace material for the integration-support tier.
        mapping:
          type: object
          required: [state]
          additionalProperties: false
          properties:
            state:
              type: string
              enum: [mapped, unmapped, building]
            sourceNodeRef:
              anyOf: [{ type: string }, { type: 'null' }]
              description: Device or zone reference. Permitted to this tier by `D3`.
            unitId:
              anyOf: [{ type: string }, { type: 'null' }]

    # ---------------------------------------------------------------- S2
    OverviewResponse:
      type: object
      required: [meta, counters, recentNotices]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        counters:
          type: array
          description: |
            **The counters the server can source.** `open-cases` remains in the `key` vocabulary
            but a case carries no scope it can be counted by until the ADR-020 amendment lands, so
            the server OMITS it from the array — omitted, not `0`, not null (`absence-is-not-zero`).
            The three shipped are `notices-active` (live now), `safety-events-window` (distinct
            events in the window) and `units-unknown-state`.

            Each value is computed server-side as the length of the list its definition produces —
            the server counts, the client never counts. For `units-unknown-state` the `basis` is
            derived from the applied definition (`unknown` and `offline` are *different* levels in
            `severity.json`), never typed beside the count; for `safety-events-window` `windowHours`
            is the same value the definition used.
          items:
            type: object
            required: [key, value, label]
            additionalProperties: false
            properties:
              key:
                type: string
                enum: [open-cases, safety-events-window, notices-active, units-unknown-state]
              basis:
                type: object
                description: |
                  Present for `units-unknown-state`. **P3 closed as a contract gap; the
                  product decision — which levels the figure should include — is open.**
                additionalProperties: false
                properties:
                  includesSeverities:
                    type: array
                    items: { $ref: '#/components/schemas/Severity' }
                  deduplicatedByUnit: { type: boolean }
              value: { type: integer, minimum: 0 }
              label: { $ref: '#/components/schemas/LocalizedText' }
              windowHours:
                anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
                description: Present for `safety-events-window`; the same explicit window as the S1 list.
        # attention[] and integrationHealth[] STAY in 2.3.0 but are OPTIONAL (removed from `required`),
        # deferred not struck (GEN-064 Amendment 6, a-removal-needs-its-consumers-counted-first):
        # S2Overview.tsx:70/:88 consume both, so a backend removal would red UI CC's track. getOverview
        # OMITS them (it sources neither); S2 stays fixture-fed until UI-065 rewires it. They come out
        # with their consumer: integrationHealth behind its ADR (M-lane), attention behind the
        # late-arrival read (Amdt 3 D4 debt).
        attention:
          type: array
          description: Ordered by service target, not by time — the export states this. Optional; getOverview omits it (no source).
          items:
            type: object
            required: [kind, title, target, link]
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: [safety, case, notice]
              title: { $ref: '#/components/schemas/LocalizedText' }
              subtitle: { $ref: '#/components/schemas/LocalizedText' }
              target: { $ref: '#/components/schemas/ServiceTarget' }
              link:
                type: object
                required: [kind, id]
                additionalProperties: false
                properties:
                  kind:
                    type: string
                    enum: [safety-event, case, notice]
                  id: { type: string }
        integrationHealth:
          type: array
          description: Optional; getOverview omits it (integration-health reads are unauthorised, M-lane).
          items: { $ref: '#/components/schemas/IntegrationFeed' }
        recentNotices:
          type: array
          description: |
            Recent notices in scope, sourced from the SAME authorised scope-parameterised live
            predicate as the `notices-active` counter (`staff-notices.list`, `lifecycleState:['live']`):
            one definition, the list and the counter agreeing by construction.
          items: { $ref: '#/components/schemas/NoticeRow' }

    # ---------------------------------------------------------------- S3
    Page:
      type: object
      required: [limit, after, next, total]
      additionalProperties: false
      description: |
        One keyset page. `after` is the cursor that produced this page;
        `next` is the cursor for the following page, or null at the end.
      properties:
        limit: { type: integer, minimum: 1 }
        after: { type: string, nullable: true }
        next: { type: string, nullable: true }
        total: { type: integer, minimum: 0 }

    ScopeTreeResponse:
      type: object
      required: [meta, grants, nodes]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        grants:
          type: array
          description: The principal's scope grants. Every read is filtered to their union.
          items: { $ref: '#/components/schemas/ScopeRef' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ScopeTreeNode' }
        page: { $ref: '#/components/schemas/Page' }

    ScopeTreeNode:
      type: object
      required: [node, label, depth, permittedActions]
      additionalProperties: false
      properties:
        permittedActions:
          type: array
          description: |
            THE CONTAINER CARRIES IT TOO (`GEN-047` Amendment 1, A2). A creation act
            is authorised against the node the new thing would be created UNDER —
            there is no object yet to carry the list — so every scope node states
            which creation acts this caller may perform NOW with a target under it.
            At 2.1.0 the only value that can appear is `composeNotice`; the
            grant-admin acts join through the same function with no shape change.
          items:
            type: string
            enum: [addEstateContact, addMembership, approveNotice, composeNotice, conferGrant, correctNotice, declineNotice, endOccupancy, provisionOrganization, publishManagementUpdate, publishNotice, recordOccupancy, registerPrincipal, removeMembership, reviseNotice, revokeGrant, submitNotice, withdrawNotice]
        node: { $ref: '#/components/schemas/ScopeRef' }
        parent:
          anyOf: [{ $ref: '#/components/schemas/ScopeRef' }, { type: 'null' }]
        label: { $ref: '#/components/schemas/LocalizedText' }
        summary:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: e.g. `3 blocks · 812 units`. Rendered from `counts`, never the reverse.
        counts:
          type: object
          description: |
            Server-owned per-node counters (GEN-064 D5): the descendant RESIDENTIAL units under
            this node and their occupied/vacant split, computed once per node, never assembled
            client-side by walking the tree — a row that says 268 and holds 265 is the
            click-31-see-28 trap in a tree. `occupied` is derived from live occupancy (current
            assertion then effective dating, never a stored flag); `vacant` is the rest.
            OPTIONAL in 2.3.0: the server always returns it, but fixtures may omit it while the
            tree screen does not yet render it — UI-065 adds it to the corpus and tightens to
            required when it does (kept off UI CC's digest until then, GEN-064 A-digest ruling).
          required: [units, occupied, vacant]
          additionalProperties: false
          properties:
            units: { type: integer, minimum: 0 }
            occupied: { type: integer, minimum: 0 }
            vacant: { type: integer, minimum: 0 }
        depth: { type: integer, minimum: 0 }
        sequence:
          type: integer
          minimum: 0
          description: |
            Sibling order among nodes that share a parent. Buildings A/B/C are 1/2/3;
            floors follow ordinal (Hong Kong omit-rule numbers, not a contiguous count);
            flats follow index (A1=1). The tree is sorted by sequence then id, never by label.
        # attention has NO authorised read (GEN-064 A5 test A) but S3Properties.tsx:111 renders it
        # (test B): left in place, logged as a MANDATORY UI-065 input — the indicator gets a real
        # source or is removed WITH the screen, not struck by this backend PID mid-flight.
        attention:
          type: boolean
          default: false

    PropertyTreeResponse:
      type: object
      required: [meta, nodes]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ScopeTreeNode' }
        page: { $ref: '#/components/schemas/Page' }

    UnitDetailResponse:
      type: object
      required: [meta, unit]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        unit:
          type: object
          required: [unitId, unitReference, label, scope, facts, household, externalReferences]
          additionalProperties: false
          properties:
            unitId: { type: string }
            unitReference:
              type: string
              description: |
                Resolution of an inferred field — the export shows `unit-8801-A1` and the
                scheme is not stated. Carried as an **opaque stable identifier** with no
                scheme asserted, because inventing one would encode a structure nobody chose.
              examples: ['unit-8801-A1']
            label: { $ref: '#/components/schemas/LocalizedText' }
            scope: { $ref: '#/components/schemas/ScopePath' }
            facts:
              type: object
              description: |
                **`SIZE / TYPE` is now carried**, having been excluded at Step 3.

                The export names no system of record for `624 sq ft · 3-bedroom`, and
                attributing a property fact to the wrong owner is an error discovered years
                later. But the parameter domain is known — the systems are the ones this
                same response already enumerates in `externalReferences`. So the fact is
                carried **with its owner stated**, and the contract attributes nothing.

                **The product decision is open:** which system actually owns it.
              required: [homeSafety, occupancyFrom, notificationLanguage]
              additionalProperties: false
              properties:
                homeSafety:
                  type: object
                  required: [enrolled]
                  additionalProperties: false
                  properties:
                    enrolled: { type: boolean }
                    serviceCount: { type: integer, minimum: 0 }
                occupancyFrom: { type: string, format: date }
                notificationLanguage:
                  type: string
                  enum: [en, zh-Hant]
                sizeAndType:
                  type: object
                  description: P6. Carried with its owner named; see the note on `facts`.
                  required: [systemOfRecord]
                  additionalProperties: false
                  properties:
                    systemOfRecord:
                      type: string
                      enum: [pemo, erp, cmms]
                    areaSqFt:
                      anyOf: [{ type: number, minimum: 0 }, { type: 'null' }]
                    layout:
                      anyOf: [{ type: string }, { type: 'null' }]
                mapping:
                  type: object
                  additionalProperties: false
                  properties:
                    state:
                      type: string
                      enum: [mapped, unmapped]
                    sourceNodeRef:
                      anyOf: [{ type: string }, { type: 'null' }]
            household:
              type: array
              items:
                type: object
                required: [name, role, safety]
                additionalProperties: false
                properties:
                  name: { type: string }
                  role: { $ref: '#/components/schemas/LocalizedText' }
                  from: { type: string, format: date }
                  to:
                    anyOf: [{ type: string, format: date }, { type: 'null' }]
                  safety: { $ref: '#/components/schemas/SafetyPermission' }
            externalReferences:
              type: array
              description: |
                PEMO holds the reference and the mirrored status only; the external system
                stays authoritative and no telemetry is displayed — the export's own words,
                and `ADR-007` `A5` for CMMS.
              items:
                type: object
                required: [system, reference, state]
                additionalProperties: false
                properties:
                  system:
                    type: string
                    enum: [twoiothub, cmms, erp]
                  reference: { type: string }
                  state:
                    type: string
                    enum: [linked, read-only, stale, unavailable]

    # ---------------------------------------------------------------- S4
    CaseListResponse:
      type: object
      required: [meta, cases, counts]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        cases:
          type: array
          items:
            type: object
            required: [reference, subject, category, scope, assignee, target, status]
            additionalProperties: false
            properties:
              reference:
                type: string
                pattern: '^CS-[0-9]{5}$'
                examples: ['CS-24118']
              subject: { $ref: '#/components/schemas/LocalizedText' }
              category:
                type: string
                enum: [building-services, enquiry, complaint]
              scope: { $ref: '#/components/schemas/ScopePath' }
              assignee:
                type: object
                description: |
                  `Unassigned` is a state, not a name. The export renders it in the same
                  column as `Ng Ka-ho`, which is a display collapse a contract must not copy.
                required: [state]
                additionalProperties: false
                properties:
                  state:
                    type: string
                    enum: [assigned, unassigned]
                  name:
                    anyOf: [{ type: string }, { type: 'null' }]
              target: { $ref: '#/components/schemas/ServiceTarget' }
              status:
                type: string
                description: |
                  **Independent of `target`.** The analysis records the relationship between
                  status and service target as not stated, so the contract does not invent
                  one — a resolved case may have met or missed its target, and a contract
                  that coupled them would encode a rule nobody wrote.
                enum: [new, in-progress, awaiting-resident, resolved, closed]
        counts:
          type: object
          required: [open, overdue, all]
          additionalProperties: false
          properties:
            open: { type: integer, minimum: 0 }
            assignedToMe: { type: integer, minimum: 0 }
            overdue: { type: integer, minimum: 0 }
            all: { type: integer, minimum: 0 }

    # ---------------------------------------------------------------- S5

    HelpdeskTone:
      type: string
      enum: [critical, warning, info, normal, unknown]

    HelpdeskChannel:
      type: string
      enum: [app, phone, counter]

    HelpdeskContactState:
      type: string
      enum: [waiting, in_progress, overdue, closed]

    HelpdeskStat:
      type: object
      required: [id, label, value, note, tone]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        label: { $ref: '#/components/schemas/LocalizedText' }
        value: { type: string }
        note: { $ref: '#/components/schemas/LocalizedText' }
        tone: { $ref: '#/components/schemas/HelpdeskTone' }

    HelpdeskQueueRow:
      type: object
      required: [id, channel, who, unit, subject, wait, state, tone]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque help-desk contact id (ticket id).
          minLength: 1
        channel: { $ref: '#/components/schemas/HelpdeskChannel' }
        who: { type: string }
        unit: { type: string }
        subject: { $ref: '#/components/schemas/LocalizedText' }
        wait: { $ref: '#/components/schemas/LocalizedText' }
        state: { $ref: '#/components/schemas/HelpdeskContactState' }
        tone: { $ref: '#/components/schemas/HelpdeskTone' }

    HelpdeskQueueResponse:
      type: object
      required: [meta, stats, rows]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        stats:
          type: array
          items: { $ref: '#/components/schemas/HelpdeskStat' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/HelpdeskQueueRow' }
        page: { $ref: '#/components/schemas/Page' }

    HelpdeskTimelineTurn:
      type: object
      required: [at, who, channel, body]
      additionalProperties: false
      properties:
        at: { type: string, format: date-time }
        who: { $ref: '#/components/schemas/LocalizedText' }
        channel:
          type: string
          enum: [app, phone, counter, system]
        body: { $ref: '#/components/schemas/LocalizedText' }

    HelpdeskContactDetail:
      type: object
      required: [id, channel, who, unit, subject, wait, state, tone, openedAt, linkedCaseRef, disposition, timeline]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        channel: { $ref: '#/components/schemas/HelpdeskChannel' }
        who: { type: string }
        unit: { type: string }
        subject: { $ref: '#/components/schemas/LocalizedText' }
        wait: { $ref: '#/components/schemas/LocalizedText' }
        state: { $ref: '#/components/schemas/HelpdeskContactState' }
        tone: { $ref: '#/components/schemas/HelpdeskTone' }
        openedAt: { type: string, format: date-time }
        linkedCaseRef:
          anyOf: [{ type: string, minLength: 1 }, { type: 'null' }]
          description: Opaque case id when linked; null when the contact stays at the desk.
        disposition: { $ref: '#/components/schemas/LocalizedText' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/HelpdeskTimelineTurn' }

    HelpdeskContactDetailResponse:
      type: object
      required: [meta, contact]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        contact: { $ref: '#/components/schemas/HelpdeskContactDetail' }

    # ------------------------------------------------------- strata + mail (live slice)

    StrataChargeStatus:
      type: string
      enum: [due, paid, partial, overdue]

    StrataChargeTone:
      type: string
      enum: [normal, information, warning, unknown]

    MailStatus:
      type: string
      enum: [queued, sending, accepted, failed, unknown, log-only]

    MailTransport:
      type: string
      enum: [log, smtp]

    MailKind:
      type: string
      enum: [invoice, admin_test, notice]

    StrataPaymentMethod:
      type: string
      enum: [fps, cheque, cash, octopus]

    StrataInvoiceEmailState:
      type: object
      required: [status, recordedAt, transport, detail]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [none, queued, sending, accepted, failed, unknown, log-only]
        recordedAt:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
        transport:
          anyOf:
            - { $ref: '#/components/schemas/MailTransport' }
            - { type: 'null' }
        detail:
          anyOf: [{ type: string }, { type: 'null' }]

    StrataChargeLineItem:
      type: object
      required: [description, amountHkd]
      additionalProperties: false
      properties:
        description: { $ref: '#/components/schemas/LocalizedText' }
        amountHkd: { type: integer }

    StrataCharge:
      type: object
      required:
        - chargeId
        - householdId
        - residentId
        - payerName
        - unitSummary
        - scope
        - period
        - kind
        - issuedOn
        - dueOn
        - amountHkd
        - paidHkd
        - status
        - tone
        - staffNotes
        - invoiceNumber
        - scheduledSendAt
        - contactEmail
        - lineItems
        - invoiceEmail
      additionalProperties: false
      properties:
        chargeId: { type: string, minLength: 1 }
        householdId: { type: string, minLength: 1 }
        residentId: { type: string, minLength: 1 }
        payerName: { type: string }
        unitSummary: { $ref: '#/components/schemas/LocalizedText' }
        scope: { $ref: '#/components/schemas/ScopePath' }
        period:
          type: string
          description: Billing period as YYYY-MM.
          pattern: '^[0-9]{4}-[0-9]{2}$'
        kind: { $ref: '#/components/schemas/LocalizedText' }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        amountHkd: { type: integer }
        paidHkd: { type: integer }
        status: { $ref: '#/components/schemas/StrataChargeStatus' }
        tone: { $ref: '#/components/schemas/StrataChargeTone' }
        staffNotes:
          anyOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
        invoiceNumber: { type: string, minLength: 1 }
        scheduledSendAt: { type: string, format: date-time }
        contactEmail:
          type: string
          format: email
          description: Invoice To snapshot at charge time; send resolves live household email first.
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/StrataChargeLineItem' }
        invoiceEmail: { $ref: '#/components/schemas/StrataInvoiceEmailState' }

    StrataChargeListResponse:
      type: object
      required: [meta, charges]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        charges:
          type: array
          items: { $ref: '#/components/schemas/StrataCharge' }

    StrataChargeReceipt:
      type: object
      required: [paymentId, method, amountHkd, paidOn]
      additionalProperties: false
      properties:
        paymentId: { type: string, minLength: 1 }
        method: { $ref: '#/components/schemas/StrataPaymentMethod' }
        amountHkd: { type: integer }
        paidOn: { type: string, format: date }

    StrataMailSendRow:
      type: object
      required: [outboxId, to, subject, status, transport, detail, recordedAt]
      additionalProperties: false
      properties:
        outboxId: { type: string, minLength: 1 }
        to: { type: string, format: email }
        subject: { type: string }
        status: { $ref: '#/components/schemas/MailStatus' }
        transport: { $ref: '#/components/schemas/MailTransport' }
        detail: { type: string }
        recordedAt: { type: string, format: date-time }

    StrataChargeDetailResponse:
      type: object
      required: [meta, charge, receipts, invoiceSends]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        charge: { $ref: '#/components/schemas/StrataCharge' }
        receipts:
          type: array
          items: { $ref: '#/components/schemas/StrataChargeReceipt' }
        invoiceSends:
          type: array
          items: { $ref: '#/components/schemas/StrataMailSendRow' }

    StrataPaymentAllocation:
      type: object
      required: [chargeId, amountHkd]
      additionalProperties: false
      properties:
        chargeId: { type: string, minLength: 1 }
        amountHkd: { type: integer }

    StrataPayment:
      type: object
      required:
        - paymentId
        - householdId
        - residentId
        - payerName
        - unitSummary
        - scope
        - paidOn
        - method
        - amountHkd
        - reference
        - staffNotes
        - allocations
      additionalProperties: false
      properties:
        paymentId: { type: string, minLength: 1 }
        householdId: { type: string, minLength: 1 }
        residentId: { type: string, minLength: 1 }
        payerName: { type: string }
        unitSummary: { $ref: '#/components/schemas/LocalizedText' }
        scope: { $ref: '#/components/schemas/ScopePath' }
        paidOn: { type: string, format: date }
        method: { $ref: '#/components/schemas/StrataPaymentMethod' }
        amountHkd: { type: integer }
        reference: { $ref: '#/components/schemas/LocalizedText' }
        staffNotes:
          anyOf:
            - { $ref: '#/components/schemas/LocalizedText' }
            - { type: 'null' }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/StrataPaymentAllocation' }

    StrataPaymentListResponse:
      type: object
      required: [meta, payments]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/StrataPayment' }

    AdminEmailTestRequest:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to:
          type: string
          format: email
          description: Arbitrary recipient — any authenticated staff may set this in v0/dev.

    MailSendResponse:
      type: object
      required:
        - meta
        - outboxId
        - kind
        - subjectId
        - to
        - from
        - subject
        - status
        - transport
        - detail
        - recordedAt
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        outboxId: { type: string, minLength: 1 }
        kind: { $ref: '#/components/schemas/MailKind' }
        subjectId:
          anyOf: [{ type: string, minLength: 1 }, { type: 'null' }]
          description: Charge id, notice id, or null for an admin test.
        to: { type: string, format: email }
        from: { type: string, format: email }
        subject: { type: string }
        status: { $ref: '#/components/schemas/MailStatus' }
        transport: { $ref: '#/components/schemas/MailTransport' }
        detail:
          type: string
          description: Human-readable outcome; never contains a secret.
        recordedAt: { type: string, format: date-time }

    MailSendResult:
      type: object
      description: One MailSendResponse without the nested meta (used inside NoticeEmailSendResponse).
      required:
        - outboxId
        - kind
        - subjectId
        - to
        - from
        - subject
        - status
        - transport
        - detail
        - recordedAt
      additionalProperties: false
      properties:
        outboxId: { type: string, minLength: 1 }
        kind: { $ref: '#/components/schemas/MailKind' }
        subjectId:
          anyOf: [{ type: string, minLength: 1 }, { type: 'null' }]
        to: { type: string, format: email }
        from: { type: string, format: email }
        subject: { type: string }
        status: { $ref: '#/components/schemas/MailStatus' }
        transport: { $ref: '#/components/schemas/MailTransport' }
        detail: { type: string }
        recordedAt: { type: string, format: date-time }

    NoticeEmailDeliverySend:
      type: object
      required: [outboxId, to, subject, status, transport, detail, recordedAt]
      additionalProperties: false
      properties:
        outboxId: { type: string, minLength: 1 }
        to: { type: string, format: email }
        subject: { type: string }
        status: { $ref: '#/components/schemas/MailStatus' }
        transport: { $ref: '#/components/schemas/MailTransport' }
        detail: { type: string }
        recordedAt: { type: string, format: date-time }

    NoticeEmailDeliveryResponse:
      type: object
      required: [meta, noticeId, schedule, email]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        noticeId: { type: string, minLength: 1 }
        schedule:
          type: 'null'
          description: Always null in this freeze — delivery schedule is not modeled on notices.
        email:
          type: object
          required: [recipientCount, sends]
          additionalProperties: false
          properties:
            recipientCount: { type: integer, minimum: 0 }
            sends:
              type: array
              items: { $ref: '#/components/schemas/NoticeEmailDeliverySend' }

    NoticeEmailSendResponse:
      type: object
      required: [meta, noticeId, transport, results]
      additionalProperties: false
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        noticeId: { type: string, minLength: 1 }
        transport: { $ref: '#/components/schemas/MailTransport' }
        results:
          type: array
          items: { $ref: '#/components/schemas/MailSendResult' }
