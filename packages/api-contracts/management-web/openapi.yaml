  /strata/charges/{chargeId}/invoice-email:
    post:
      tags: [Strata]
      operationId: sendStrataChargeInvoiceEmail
      summary: Send a plain-text invoice email for one charge.
      description: |
        No request fields. Omit `Content-Type`, or send `{}`. An empty
        `application/json` body is rejected by the HTTP server before the handler.
        To = live household email via household contacts for `charge.householdId`;
        if null/empty, fall back to the charge `contactEmail` snapshot. From =
        `SMTP_FROM` or `invoices@wingfu.example`. Records `strata.email_outbox`
        `kind=invoice`. Secrets stay in `SMTP_*` — never in the request body.
      parameters:
        - name: chargeId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Invoice send recorded (queued, sending, accepted, failed, unknown, or log-only).
