openapi: 3.1.0

info:
  title: PEMO Management Web API
  version: 2.7.0
  summary: Read surfaces for the first five management screens, and four scope-only writes.
  description: |
    The second contract package, sibling to `resident-mobile` per `ADR-007` `D2`.

    **Reads, and the first write.** This package was read-only while *"may this principal
    do this"* was undecided — `ADR-007` `A4` recorded that role differentiation was
    entirely undesigned, so every write a screen implies was deferred. **`ADR-010` `D1`
    has since decided it**: the 27 scope-only actions are released on scope alone, on the
    condition that each carries an audit record written in the same transaction as the
    act, attributable to a principal, effective-dated, and not amendable by the actor.

    `publishManagementUpdate`, `recordOccupancy` and `addEstateContact` are the **first
    three** of the 27; they share one path — the same gate, the same audited write, the
    same narrowest-grant record — differing only in vehicle, contract and domain
    preconditions. The remaining 24 — and every action `D2` classifies as a capability
    rather than a scope-only act — stay deferred. A write appears in this package when
    its authorization is decided, never before.

    **WHICH LAYER DECIDES DIFFERS BY SURFACE, AND EACH OPERATION SAYS WHICH.** The gate is
    always *expand the caller's grants, filter, and answer ABSENT* — but where the filter
    can run depends on whether the act's scope node is the writing module's own fact.
    `recordOccupancy` is scoped by a unit, which belongs to Property Core, so its
    authoritative gate is the authorizing-grant lookup. `addEstateContact` is scoped by an
    estate, which is the writing module's own table, so its authoritative gate is the
    in-query filter itself. Reading one operation's arrangement into another would be
    reasoning about the wrong control, so neither is left to be inferred.

    **`ADR-011` `D10` is not lifted by this.** No write on a party's *interest* is
    contracted here: `D10` closes that surface until its Open question 1 decides whether
    it needs the Approver. `ADR-011` `D7` makes occupancy and interest separate facts,
    which is why one may be written while the other may not.

    **Separate package, not a role-scoped variant.** `D2`'s reasoning is the one that
    governs everything here: the resident boundary's value is that it is *unconditional*
    — no resident response may carry a device identifier, provable over the whole corpus
    without evaluating anything. Serving both audiences from one contract would make that
    scan role-conditional, replacing a structural guarantee with a policy that must be
    evaluated correctly every time.

    The same move recurs three times in this package and is worth naming once:
    **when a rule applies to a subset, apply the mechanism to the subset — never to the
    container with a condition attached.**

    **Audience: estate staff (`ADR-007` `D3` tier 2).** They see device and location
    references, source classification and provenance. They do **not** see raw payloads or
    correlation traces, which are integration-support material.

  contact:
    name: PEMO Master Brain — contract owner
  license:
    name: UNLICENSED

servers:
  - url: https://{host}/api/management-web/v0
    description: Placeholder. Deployment topology is Unresolved in the committed baseline.
    variables:
      host:
        default: pemo.invalid

security:
  - staffBearer: []

paths:

  /scope:
    get:
      tags: [Scope]
      operationId: getScope
      summary: The scope tree this principal may address.
      description: |
        The shell's scope selector. The export renders one estate and a chevron whose open
        state was never designed; `ADR-007` `D9`/`A3` requires Organization and Portfolio
        from the first version, so this returns the principal's grants and their subtrees
        rather than a single estate.

        Includes `ADR-003` Locations alongside hierarchy nodes — `A2`. `Counter` and the
        clubhouse facility locations are addressable and have no floor and no unit.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageAfter'
      responses:
        '200':
          description: Scope tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeTreeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/CursorExpired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /safety/events:
    get:
      tags: [Home Safety]
      operationId: listSafetyEvents
      summary: Safety events across the scope (S1).
      description: |
        **Mixed-level by default.** In-unit events, building events, an estate-wide
        advisory and a quarantined event belonging to no node at all appear in one list —
        `D5`/`A1`. Filtering is in the query; a row a client would have to hide has
        already leaked.

        **Deferred writes on this screen:** publish update, acknowledge receipt, request
        access. Each needs *"may this principal do this"*, and the role list is open.
      parameters:
        - $ref: '#/components/parameters/ScopeParam'
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, needs-action, in-unit, building, unmapped]
            default: all
      responses:
        '200':
          description: Safety event list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyEventListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScopeNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /safety/events/{eventId}:
    get:
      tags: [Home Safety]
      operationId: getSafetyEvent
      summary: Safety event detail and its resident projection (S1).
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyEventDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /safety/events/{eventId}/updates:
    post:
      tags: [Home Safety]
      operationId: publishManagementUpdate
      summary: Publish a management update on a safety event (S1) — the first scope-only write.
      description: |
        `ADR-010` `D1`, the first of the 27 actions released on scope alone.

        **Authorization is scope, and out-of-scope is ABSENT.** The caller's
        `estate_staff` grants are expanded to the estates they cover and applied in the
        query. An event outside them answers **404**, identically to an event that does
        not exist — a distinct `403` would confirm the event's existence to a principal
        with no scope over it. `403` is therefore NOT among this operation's responses,
        and its absence is the decision, not an omission.

        **Every accepted call writes an audit record in the same transaction as the act.**
        The record carries the acting principal, the `(group, role, node)` grant that
        authorized it, and the instant the grant was resolved at, so authority can be
        reconstructed rather than re-derived. `D1` is explicit that this is a requirement
        on the write path, not a logging preference.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagementUpdateRequest' }
      responses:
        '201':
          description: The update was published and its audit record written with it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementUpdateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /safety/events/{eventId}/delivery:
    get:
      tags: [Home Safety]
      operationId: getSafetyEventDelivery
      summary: Recipients and timeline for an event (S1).
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Delivery state and timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyEventDeliveryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /safety/events/{eventId}/source:
    get:
      tags: [Home Safety]
      operationId: getSafetyEventSource
      summary: Source and mapping provenance for an event (S1) — estate-staff tier.
      description: |
        **This operation exists separately so the `D3` boundary sits on an operation
        rather than inside a response.** It is the only projection carrying restricted
        material, so it can be authorised and scanned as a unit — the same move as `D2`
        choosing separate packages over a conditional scan.

        **Carried (provenance):** source system, source event id, what the source
        classified, what PEMO shows and under which policy version, occurrence time,
        device or zone reference and mapping state.

        **Absent (correlation trace — integration-support tier):** idempotency key,
        message supersession, transport delta between source and receipt, duplicate
        delivery count, replay semantics. **Not gated — absent.** The test that produced
        that split: *does this field describe how the message travelled, or what the event
        is?*
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Source and mapping provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafetyEventSourceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RestrictedProjection' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /units/{unitId}/occupancies:
    post:
      tags: [Residents]
      operationId: recordOccupancy
      summary: Record a resident's occupancy of a unit — the second scope-only write.
      description: |
        `ADR-010` `D1`, and *"household and resident administration"* is named in its
        ungated list. Same path as `publishManagementUpdate`: the same gate, the same
        audited write, the same narrowest-grant record. The act and its audit are written
        in one transaction.

        **THE AUTHORITATIVE GATE IS THE AUTHORIZING-GRANT LOOKUP.** The caller's
        `estate_staff` grants are expanded and the act is authorised only if one of them
        covers this unit; that lookup is what refuses, and it refuses before any write is
        attempted. It is named here rather than left to be inferred, because the request
        also carries the allowed unit set **into the query** — the write runs
        `WHERE unit_id = ANY(<allowed>)` — and that second filter is **defence in depth,
        not the deciding layer**. A reader who assumed the query filter was the gate would
        be reasoning about the wrong control.

        **The scope node is the UNIT**, where the first write's was the estate. Out of
        scope answers **404**, identically to a unit that does not exist — `403` is absent
        by decision, not omission. Nothing out of scope is fetched and then rejected: the
        grant lookup is a scope computation, and the target row is never read.

        **This records a NEW occupancy; it does not end or amend one.** The runtime role
        holds `INSERT` and `SELECT` only, so an occupancy is never mutated in place.
        Ending one is not offered by this contract: `0022` carries no supersession key and
        its reader admits any row active at the instant, so an appended "ended" row would
        not end anything. Stated as deferred rather than left silently absent.

        **This is not an interest.** `ADR-011` `D7`: occupancy and interest are separate
        facts, neither implying the other.
      parameters:
        - name: unitId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordOccupancyRequest' }
      responses:
        '201':
          description: The occupancy was recorded and its audit record written with it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordOccupancyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            This resident already holds a current occupancy of this unit. A DOMAIN refusal,
            reachable only in scope — the conflict lookup is scope-filtered so an
            out-of-scope caller cannot learn an occupancy exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /estates/{estateId}/contacts:
    post:
      tags: [Property]
      operationId: addEstateContact
      summary: Add an estate contact — the third scope-only write.
      description: |
        `ADR-010` `D1`. A **first assertion**: `estate_contact` carries many rows per
        estate with no status column and no effective dating, so adding one supersedes
        nothing and the act is a plain insert of a row valid on creation.

        **THE AUTHORITATIVE GATE IS THE IN-QUERY FILTER**, and on this surface that is the
        whole of it. The caller's `estate_staff` grants are expanded to the estates they
        cover and that set goes INTO the query that resolves the estate, so an estate
        outside it returns **no row** and answers **404** — identical to an estate that
        does not exist. Nothing is fetched and then rejected, and nothing runs before it
        that could shadow it: the authorizing-grant lookup that follows does **not** gate,
        it runs on an already-admitted estate solely to name the narrowest authority for
        the audit record.

        This is the inverse of `recordOccupancy`, whose scope node belongs to another
        module and whose authoritative gate is therefore the grant lookup. `403` is absent
        from both by the same decision.

        Every accepted call writes an audit record in the same transaction as the act,
        carrying the acting principal, the narrowest authorizing grant, and the instant
        the grant was resolved at.

        **THE ONE-MANAGEMENT-OFFICE INVARIANT IS NOT YET DATABASE-ENFORCED.** It is applied
        in the write path as *count, then insert*, so two concurrent requests can both
        observe zero and both insert, leaving an estate with two management office
        contacts. `estate_contact` carries no constraint that would prevent it. Stated here
        rather than left to be discovered, in the same form as `recordOccupancy`'s deferred
        end path.

        The fix is a **partial unique index** on `(estate_id)` where
        `contact_kind = 'management_office'`, with the resulting unique violation mapped to
        the same `management-office-contact-exists` response, so the answer a client sees
        does not change when the enforcement moves. It is **bound to the idempotency
        decision** — both are about what a repeated or concurrent request may do to an
        append-only write path — and is deliberately not taken here: it is a migration, and
        this operation's PID may not originate schema.
      parameters:
        - name: estateId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddEstateContactRequest' }
      responses:
        '201':
          description: The contact was added and its audit record written with it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddEstateContactResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            This estate already has a management office contact. A DOMAIN refusal, per
            kind rather than blanket: emergency and approved-service contacts are
            legitimately plural. Reachable only in scope.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /occupancies/{occupancyId}/end:
    post:
      tags: [Residents]
      operationId: endOccupancy
      summary: End a resident's occupancy of a unit — an appended assertion, never a mutation.
      description: |
        `ADR-013`. An end is **not** an update: it is a further **assertion** about the same
        instance — `version + 1` with `effective_to` set — and the prior assertion is left
        exactly as it was and becomes history. The runtime role holds `INSERT` and `SELECT`
        only, so nothing here could mutate a row even if the model allowed it.

        **Ended-by-act, distinct from lapsed.** A tenure leaves its live state two ways: it
        LAPSES when its effective interval elapses, or it is ENDED by a superseding
        assertion. This operation performs the second. Liveness is computed from the current
        assertion's dating; there is no stored flag.

        **THE AUTHORITATIVE GATE IS THE AUTHORIZING-GRANT LOOKUP**, as in `recordOccupancy`
        and for the same reason: the scope node is a unit, which is Property Core's fact, so
        the writing module cannot resolve it alone. Out of scope answers **404**, identical
        to an occupancy that does not exist, and `403` is absent by that decision.

        **A NON-LIVE OCCUPANCY IS REFUSED AND NOTHING IS APPENDED** (409). A failed
        precondition must not leave a no-op row in the version chain. Re-ending with a
        different `effectiveTo` is a *correction*, which is a different act and is not
        contracted here.

        **Retry-idempotency is NOT provided.** A repeated end answers 409, not the original
        response. Resolving a retry to the winning act's response is the request-token half
        of `ADR-013` `D6` and is a separate decision; only the state-identity half — at most
        one live occupancy, at most one assertion per version — is held here.
      parameters:
        - name: occupancyId
          in: path
          required: true
          description: The occupancy INSTANCE, not an assertion.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndOccupancyRequest' }
      responses:
        '200':
          description: The end assertion was appended, with its audit record, in one transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EndOccupancyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The occupancy is not live — already ended, or lapsed by its own dating. Nothing
            is appended.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /grants:
    post:
      tags: [Access]
      operationId: conferGrant
      summary: Confer a scope grant on a group -- the act that creates authority.
      description: |
        **THE FIRST SURFACE THAT CREATES AUTHORITY.** A grant is held by a GROUP
        (`ADR-012` `D2`), keyed `(group, role, node)` and effective-dated, and it is
        an append-only assertion series since `0118`.

        **THE AUTHORITATIVE GATE IS THE AUTHORIZING-GRANT LOOKUP OVER THE NODE THE
        NEW GRANT NAMES** -- `ADR-010` `D3`'s `G-2` rule: a principal may create a
        grant only within a node they already hold, as `grant_administrator`. It is
        evaluated INSIDE the act's transaction, so a concurrent revocation of the
        caller's own authority cannot race it. A caller holding no such grant
        receives **404**, identical to a node that does not exist; **403 is absent
        by that decision**, because a distinct refusal would confirm the node exists
        to someone with no authority over it.

        **A `grant_administrator` MAY CONFER `grant_administrator` at or below a
        node they hold. That is `D3` working -- delegation is by scope, downward --
        and NOT a privilege escalation.** It is stated here so it cannot later be
        "fixed" as one.

        **Idempotency stance: `client-key`** (`ADR-015` `D1`). Supply
        `Idempotency-Key`. The grant's own id is DERIVED from the operation and the
        key, so a retry cannot present a different act; the request fingerprint
        covers `groupId`, `role`, `nodeKind`, `nodeId`, `effectiveFrom` and
        `reasonCode`, and the same key offered for a different request is refused
        rather than answered with the first act's result.

        **A REPLAY ANSWERS 200, NOT 201.** A replay is not a creation: nothing was
        created, and the response is re-derived by reading the act the first
        attempt produced (`D4`).

        **A reason is REQUIRED** (`ADR-014` `D4`). Conferring authority without a
        recorded why is the audit gap `ADR-014` exists to close.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConferGrantRequest' }
      responses:
        '201':
          description: The grant was conferred, with its audit record and its idempotency key, in one transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantResponse' }
        '200':
          description: A REPLAY of an identical earlier request. Nothing was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A live grant already exists for this key, or the idempotency key was used for a different request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /grants/{grantId}/revoke:
    post:
      tags: [Access]
      operationId: revokeGrant
      summary: Revoke a scope grant -- an appended assertion, never a mutation.
      description: |
        `ADR-013`. A revocation is `version + 1` with `effective_to` set; the prior
        assertion is left exactly as it was and becomes history, so **"what was in
        force then" is still answerable after the fact**. Before `0118` this act was
        not expressible by the runtime at all.

        **`G-2` APPLIES SYMMETRICALLY**: the caller must hold `grant_administrator`
        over the node the REVOKED grant names. Out of scope answers **404**.

        **THE LAST LIVE `grant_administrator` IN AN ORGANIZATION CANNOT BE REVOKED**
        (409). With none left, no grant can ever be conferred again and provisioning
        cannot re-enter, because the organization has already held grants. Refusing
        to remove the last way in opens no path to self-granting, so `ADR-010` `A1`
        is untouched. The scope is the ORGANIZATION, not the organization node: an
        administrator granted at an estate is still an administrator.

        **A NON-LIVE GRANT IS REFUSED AND NOTHING IS APPENDED** (409).

        **Idempotency stance: `client-key`.** A retry after a successful revocation
        REPLAYS and does not append a second version -- the version is derived from
        current state, so the key check preceding the act is what makes it stable.

        **A reason is REQUIRED.**
      parameters:
        - name: grantId
          in: path
          required: true
          description: The grant INSTANCE, not an assertion.
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeGrantRequest' }
      responses:
        '200':
          description: The revocation was appended, or an identical earlier request was replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The grant is not live, it is the last administrator, or the key was used for a different request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /organizations/{organizationId}/provision:
    post:
      tags: [Access]
      operationId: provisionOrganization
      summary: The provisioning act -- the first grant an organization ever holds.
      description: |
        `ADR-010` `A1`: **the bootstrap is an EVENT, not a role.** This is the only
        grant not authorized by a prior grant, and the only act on this surface with
        no acting principal -- its audit record carries `source: provisioning` with
        **no** principal, group or role, which the schema enforces rather than
        trusts.

        **ADMISSIBLE IF AND ONLY IF THE ORGANIZATION HAS NEVER HELD A GRANT.** Not
        "holds none now": under a liveness predicate an organization that revoked
        its last grant would become provisionable again **by anyone**, which is the
        standing break-glass `A1` forbids, reached through an ordinary revocation.
        The act can therefore only ever be the first, and cannot be reached again.

        It confers `grant_administrator` at the ORGANIZATION node -- the narrowest
        scope from which the whole organization can be administered under `D3`.

        **Idempotency stance: `derived-key`** (`ADR-015` `D1`), and **the key is the
        `organizationId` itself**. `A1` speaks of deriving from "the
        Organization-creation provisioning event"; **no such event exists in this
        system and none is invented here.** The organization's own existence is the
        originating fact, and it is stable, unique, and available -- so it is the
        key. Recorded here rather than left as an implementation detail.

        **THE GENESIS ACT: FOUR ASSERTIONS, ONE TRANSACTION.** It records the first
        principal, creates the group, confers the first grant and seats the first
        membership — or none of them. Before `1.0.0` it required the group and the
        principal to exist already, which was unreachable in an empty organization.

        **IDEMPOTENCY STANCE: `exempt`, WITH A STATED REASON** (`ADR-015` `D1`):
        *a genesis act has no acting principal to key on, and zero-grants-EVER over
        an append-only relation is a stronger exactly-once than a key table gives.*
        A repeat after a committed provision is refused **409**, not replayed; a
        repeat after a rolled-back one provisions.

        **THIS IS THE ONLY PLACE A GROUP IS CREATED WITHOUT A `G-2` GATE**, and it
        is safe ONLY because the predicate makes it once-only. There is no prior
        principal to gate against — that is what genesis means.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionRequest' }
      responses:
        '201':
          description: The first grant was created, with its provisioning audit record, in one transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantResponse' }
        '200':
          description: A REPLAY. The organization was already provisioned by this same act.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrantResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The organization has held a grant before and can never be provisioned again.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /principals:
    post:
      tags: [Access]
      operationId: registerPrincipal
      summary: Record an external identity so it can be authorized.
      description: |
        `ADR-016`: **PEMO authorizes, it does not authenticate.** This RECORDS an
        identity the outside world already knows; it never mints a person and
        never verifies a credential. **Nothing secret is accepted or stored** —
        there is no credential field here and no column that could hold one.

        **FLOOR (`ADR-017` `D3`): effective `grant_administrator` at the
        organization node.** "Effective" is the `GEN-030` witness — a live grant
        AND a live membership — so a grant held by a group with no members does
        not admit anyone.

        **THIS IS NOT A GENESIS BYPASS.** It requires an existing effective
        administrator, and an unprovisioned organization has none by definition,
        so it cannot be used to provision one. The genesis act remains the only
        way in, and its zero-grants-EVER guard is untouched.

        **Idempotency stance: `derived-key`** (`ADR-015` `D1`) on
        `(organizationId, externalId)`. That pair is the natural stable identity of
        the act, the per-organization unique index enforces exactly-once, and an
        identity is never ended and re-asserted — so unlike membership there is no
        legitimate repeat that a derived key would wrongly collapse.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPrincipalRequest' }
      responses:
        '201':
          description: The identity was recorded, with its audit record, in one transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrincipalResponse' }
        '200':
          description: A REPLAY of an identical earlier request. Nothing was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrincipalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is not an effective grant administrator at the organization node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This external identity is already recorded in this organization.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /groups/{groupId}/members:
    post:
      tags: [Access]
      operationId: addMembership
      summary: Seat a person in a group -- conferral by proxy, and the most dangerous act here.
      description: |
        Adding a member hands them the **union of the group's live grants**, at
        every node those grants name, in one act and with no per-grant decision.

        **FLOOR (`ADR-017` `D1`): effective `grant_administrator` covering EVERY
        node the group holds a live grant at.** A **conjunction, never a subset** —
        there is no partial membership, so covering some of the nodes is not
        authority to confer some of it. This is what stops a building
        administrator adding themselves to the group that holds
        `grant_administrator` at the organization.

        **A GROUP WITH NO LIVE GRANTS REQUIRES `grant_administrator` AT THE
        ORGANIZATION NODE.** A vacuous conjunction over an empty set would admit
        anybody, and that is a PRE-STAGING path rather than a harmless no-op: the
        caller would inherit whatever a legitimate administrator later confers,
        and the conferrer's own `G-2` looks at the node and never enumerates
        members, so nothing downstream would catch it.

        Evaluated **inside the act's transaction**, so a grant conferred on the
        group a moment ago is seen and a concurrent revocation of the caller's own
        authority cannot race it.

        **Idempotency stance: `client-key`.** A derived `(group, principal)` key
        would be wrong here: the assertion model permits a legitimate
        remove-then-re-add — a re-instatement is a NEW membership instance — and a
        derived key would collapse it against the prior membership. The client's
        token distinguishes a retry from a new intentional change.

        **A reason is REQUIRED** (`ADR-014`).
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMembershipRequest' }
      responses:
        '201':
          description: The membership was seated, with its audit record, in one transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '200':
          description: A REPLAY of an identical earlier request. Nothing was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller does not administer every node this group confers at.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already a member, or the key was used for a different request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /memberships/{membershipId}/remove:
    post:
      tags: [Access]
      operationId: removeMembership
      summary: End a membership -- an appended assertion, never a mutation.
      description: |
        `ADR-013`: `version + 1` with `effective_to` set; the prior assertion is
        left exactly as it was, so **what a person was permitted to see THEN is
        still answerable** after the removal.

        **FLOOR (`ADR-017` `D2`): the same administration floor as `addMembership`,
        PLUS the no-last-effective-administrator guard.** Removing a member confers
        nothing, so it is monotonic-safe against escalation — but unrestricted
        removal is a **lockout attack**: strip a node's administrators and nothing
        can be granted there again. The removal must not leave the organization
        with no live effective administrator, where "effective" is the `GEN-030`
        witness (a live grant AND a live membership).

        **The guard runs FIRST**, before the ending assertion, under the
        organization-scoped advisory lock — so a refusal appends nothing, and two
        concurrent removals of the last two distinct administrators cannot each
        observe the other still present.

        **Idempotency stance: `client-key`**, for the same reason as
        `addMembership`. **A reason is REQUIRED.**
      parameters:
        - name: membershipId
          in: path
          required: true
          description: The membership INSTANCE, not an assertion.
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveMembershipRequest' }
      responses:
        '200':
          description: The removal was appended, or an identical earlier request was replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller does not administer every node this group confers at.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The membership is not current, it is the last effective administrator,
            or the key was used for a different request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /helpdesk/queue:
    get:
      tags: [Helpdesk]
      operationId: listHelpdeskQueue
      summary: Office help-desk queue (stats + rows).
