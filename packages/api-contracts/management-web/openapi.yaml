  /properties/units/{unitId}:
    get:
      tags: [Properties]
      operationId: getUnitDetail
      summary: Unit facts, household and external references (S3).
      description: |
        **Deferred write:** revoke a resident-granted safety-viewing permission. The export
        states that permission is granted by the resident in the app and may be revoked by
