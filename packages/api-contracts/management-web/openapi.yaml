        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: Counters and recent notices for the picked scope (S2).
      description: |
        The three counters the server can source, each computed as the length of the list its
        definition produces (the server counts, the client never counts), plus recent notices in
        scope from the same authorised live predicate as `notices-active`. `open-cases` is absent
        (not zero) until a case carries its own scope. `attention[]` and `integrationHealth[]` stay
        declared but the route OMITS them (it sources neither); S2 stays fixture-fed for those two
        regions until UI-065 rewires it — the route does not fabricate them.
      parameters:
        - $ref: '#/components/parameters/ScopeParam'
      responses:
        '200':
          description: Overview.
          content:
            application/json:
