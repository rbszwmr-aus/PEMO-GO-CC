        '503': { $ref: '#/components/responses/CommunicationsUnavailable' }

  /admin/email/test:
    post:
      tags: [Admin]
      operationId: sendAdminEmailTest
      summary: Send a test email to an arbitrary address (v0/dev).
      description: |
        Body is `{ "to": "staff@example.com" }` only. Any authenticated staff may
        POST arbitrary `to` — v0/dev only; tighter gate before production SMTP.
        SMTP host/user/password stay in server env. Records `kind=admin_test`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminEmailTestRequest' }
      responses:
